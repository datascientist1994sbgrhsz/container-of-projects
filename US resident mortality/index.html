.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:9;background:#fff;padding:6px}

nav{display:flex;flex-wrap:wrap;margin-top:4px}

.wrap{display:flex;align-items:flex-start}

#side:empty{display:none}

td:first-child,th:first-child,td.l,th.l{text-align:left}
.hi{background:var(--hi)}.pk{background:var(--pk)}.lo{background:var(--lo)}.br{background:var(--br)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin:8px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.card small,.card span{color:var(--mute);font-size:11px;display:block}
.card em{display:block;font:650 1.18rem/1.15 system-ui;font-style:normal;margin:1px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mute);font-size:12px;margin:2px 0 6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px;vertical-align:middle}
.bad{color:#b91c1c;font-weight:600}
footer{border-top:1px solid var(--line);padding:8px 12px calc(16px + env(safe-area-inset-bottom));color:var(--mute);font-size:11px}
@media(max-width:800px){
  :root{--hdr:0px}
  header{position:static;padding:calc(8px + env(safe-area-inset-top)) 10px 0}

  #side{width:100%;max-height:none;position:static;display:flex;flex-wrap:nowrap;align-items:center;gap:4px;padding:8px 0;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain}
  #side h4{flex:0 0 auto;margin:0 6px 0 0;width:auto}

  #pane{padding:10px 10px 28px}.top small{display:none}table{min-width:560px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(146px,1fr))}

@media(pointer:coarse){nav a,#side button{min-height:40px}}
@media print{
  header,#side,footer,#q{position:static!important}

  .scroll{overflow:visible;border:0}
  table{min-width:0}
  canvas{break-inside:avoid;max-width:100%}
  a{color:inherit;text-decoration:none}

function draw(id,years,series,ymax,unit){
  const c=$(id); if(!c||!years.length) return;
  const cssW=c.getBoundingClientRect().width||(c.parentNode&&c.parentNode.clientWidth)||0;
  const dpr=Math.min(window.devicePixelRatio||1,2.5),W=Math.max(cssW,280),n=years.length,H=210;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';
  const g=c.getContext('2d'); g.scale(dpr,dpr);
  const L=44,T=16,R=36,B=36,w=W-L-R,h=H-T-B,den=Math.max(1,n-1);
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  g.strokeStyle='#e5e7eb';g.beginPath();g.moveTo(L,T);g.lineTo(L,T+h);g.lineTo(L+w,T+h);g.stroke();
  g.font='10px system-ui';
  for(let i=0;i<=4;i++){
    const yy=T+h*i/4,v=ymax*(1-i/4);
    g.strokeStyle='#f3f4f6';g.beginPath();g.moveTo(L,yy);g.lineTo(L+w,yy);g.stroke();
    g.fillStyle='#6b7280';g.textAlign='right';g.fillText(v>=100?Math.round(v):v.toFixed(v>=10?0:1),L-6,yy+3);
  }
  const st=n<=14?1:n<=30?2:n<=80?5:10;
  years.forEach((y,i)=>{
    if(i%st&&i&&i!==n-1) return;
    g.save();
    g.translate(L+w*i/den,T+h+13);
    g.rotate(-.35);
    g.fillStyle='#374151';
    g.textAlign=i===0?'left':i===n-1?'right':'center';
    g.fillText(String(y),0,0);
    g.restore();
  });
  series.forEach(S=>{
    g.strokeStyle=S.c||COL.o;g.lineWidth=S.w||1.8;g.lineJoin='round';g.beginPath();
    S.s.forEach((v,i)=>{const x=L+w*i/den,y=T+h*(1-Math.max(0,v)/ymax);i?g.lineTo(x,y):g.moveTo(x,y)});
    g.stroke();
    if(n<=20) S.s.forEach((v,i)=>{g.fillStyle=S.c||COL.o;g.beginPath();g.arc(L+w*i/den,T+h*(1-Math.max(0,v)/ymax),2.1,0,7);g.fill()});

    <h2>Drug-poisoning deaths, thousands · 1968–Feb 2026</h2><canvas id="co"></canvas>
    <p class="legend"><i style="background:#dc2626"></i>murder <i style="background:#2563eb"></i>poisoning · <a data-go="charts">all figures</a></p>`;
},
charts(){
  $('side').innerHTML='<h4>Jump</h4><button type="button" data-go="covid">COVID</button><button type="button" data-go="five">Year table</button>';
  return `<h1>Figures</h1>
    <h2>Crude all-cause /100k · 1900–2025</h2>
    <p class="legend"><i style="background:#111827"></i>population-scaled · not age-standardized</p>
    <canvas id="cac"></canvas>
    <h2>Crude all-cause /100k · 2015–25</h2><canvas id="c4"></canvas>
    <h2>UCR murder /100k · 1960–2025</h2><canvas id="cm"></canvas>
    <h2>Drug-poisoning deaths, thousands</h2><canvas id="co"></canvas>
    <h2>2015–25 counts, thousands</h2>
    <p class="legend"><i style="background:#dc2626"></i>murder <i style="background:#2563eb"></i>poisoning <i style="background:#7c3aed"></i>COVID (2024 = underlying)</p>
    <canvas id="c3"></canvas>
    <h2>COVID-involving · 2018–24</h2><canvas id="ccov"></canvas>
    <h2>Excess vs U.S. expected · 2015–24</h2><canvas id="cex"></canvas>
    <p>No official NVSS 2025–26 excess year-total. Age-adjusted 689.2 (2025) versus 715.2 (2019) is a deficit on that ruler. JAMA HIC-peer excess in 2023 = 705,331 (2025 unpublished). RGA: 2024 U.S.-expected excess ≈0.4% (≈12k).</p>
    <h2>Excess vs high-income peers · 2019–23 (JAMA Health Forum 2025)</h2><canvas id="cpeer"></canvas>
    <h2>1918 influenza excess · 1917–21</h2><canvas id="c18"></canvas>
    <p>Influenza ≈675k U.S.; COVID certified ≈1.16M+. Per 100k, 1918 exceeds COVID (smaller denominator, younger deaths).</p>`;
},
murder(){
  sideYears(1960,2026,1);
  let rows='';
  M.forEach((r,i)=>{
    const p=i?M[i-1][1]:null,d=r[1]==null||p==null?'':((r[1]-p>=0?'+':'')+(r[1]-p).toFixed(1));
    const cls=r[1]==null?'hi':r[1]>=10?'pk':r[1]<=4.2?'lo':(r[0]===2020||r[0]===2021)?'hi':'';
    rows+=`<tr class="${cls}"><td><a data-yr="${r[0]}">${r[0]}</a></td><td>${r[1]==null?'n/a':r[1].toFixed(1)}</td><td>${r[2]==null?'no UCR year':fmt(r[2])}</td><td>${d}</td><td class="l">${note(r[0])}</td></tr>`;
  });
  return `<h1>UCR murder / non-negligent manslaughter</h1>
    <div class="warn">Police-reported offense. NVSS <b>homicide</b> (death certificates) is a different construct and is higher in some years (2024 NVSS homicide = 20,162). 2021 NIBRS transition: treat the count as less comparable.</div>
    ${table(['Year','Rate','Count','Δ rate',{t:'Note',l:1}],rows)}`;
},
od(){
  sideYears(1968,2026,1);
  let rows='';
  OD.forEach(r=>{
    const cls=r[0]===1979||r[0]===1999?'br':r[1]>1e5?'pk':r[0]>=2023?'lo':'';
    rows+=`<tr class="${cls}"><td><a data-yr="${r[0]}">${r[0]}</a></td><td>${fmt(r[1])}</td><td>${r[2]==null?'—':r[2]}</td><td>${SYN[r[0]]?fmt(SYN[r[0]]):'—'}</td><td class="l">${note(r[0])||(r[0]>=2015&&r[0]<=2022?'T40.4-dominated rise':'')}</td></tr>`;
  });
  return `<h1>NVSS drug-poisoning (overdose)</h1>
    <div class="warn">ICD-10 X40–X44, X60–X64, X85, Y10–Y14. Violet rows are <b>revision breaks</b> (ICD-9 1979; ICD-10 1999), not biological discontinuities. T40.4 is multiple-mention; deaths may appear on more than one drug row.</div>
    ${table(['Year','Deaths','Rate','T40.4',{t:'Note',l:1}],rows)}
    <p>2026 calendar year is unpublished (≈4-month lag). Window ending Feb 2026 = <b>68,641</b>. Linear prorate 1 Jan–18 Aug ≈ <b>43,000</b> if that pace held — illustration only.</p>`;
},
five(){
  sideYears(1900,2026,1);
  let rows='';
  for(let y=1900;y<=2026;y++){
    const m=mOf(y),o=oOf(y),a=ac(y),r=acr(y);
    const cls=y===1918||y===2020||y===2021?'pk':y===1979||y===1999?'br':y===2026?'hi':(m&&m[1]>=10)||(o&&o[1]>1e5)?'pk':y>=2023?'lo':'';
    rows+=`<tr class="${cls}"><td><a data-yr="${y}">${y}</a></td>
      <td>${a?fmt(a):'—'}</td><td>${r?r.toFixed(0):'—'}</td>
      <td>${y<2020?0:fmt(COVID[y])}</td>
      <td>${EXCESS[y]!=null?fmt(EXCESS[y]):(y<1918||(y>1920&&y<2020)?'0':'—')}</td>
      <td>${m&&m[1]!=null?m[1].toFixed(1):(y===2026?'n/a':'—')}</td>
      <td>${m&&m[2]!=null?fmt(m[2]):(y===2026?'—':'—')}</td>
      <td>${o?fmt(o[1])+(y===2026?'*':''):'—'}</td>
      <td>${fmt(SYN[y])}</td><td>${VIO[y]??'—'}</td>
      <td class="l">${note(y)||(y<1933?'DRA incomplete':'')}</td></tr>`;
  }
  return `<h1>Annual file</h1>
    <div class="note">All-cause 1900–2025. <b>/100k</b> = crude (D/P × 10⁵), not year-2000 age-adjusted. 1900–32: published national estimates (000s; registration incomplete). 1933–24: NVSS resident registrations. 2025: provisional. COVID = U07.1 <b>involving</b> (0 before 2020). Excess = U.S.-expected residual, not a HIC-peer gap. 1918–20 influenza split is approximate.</div>
    ${table(['Year','All-cause','/100k','COVID','Excess','Mur /100k','Murders','Poison.','T40.4','Viol.',{t:'Note',l:1}],rows)}
    <p>*2026 poisoning = 12-month window to Feb 2026. Do not read 2025 excess as a CDC zero.</p>`;
},
compare(){
  sideYears(1970,2025,5);
  const ys=[1970,1980,1990,2000,2010,2015,2020,2022,2025];
  const rows=ys.map(y=>{
    const m=mOf(y),o=oOf(y);
    const ratio=m&&o&&m[2]? (o[1]/m[2]) : null;
    const mark=y===1980?' *ICD-9':(y===2000&&ratio>1?' · poisoning exceeds murder':'');
    return `<tr><td>${y}</td><td>${m?fmt(m[2]):'—'}</td><td>${o?fmt(o[1]):'—'}</td><td>${ratio==null?'—':ratio.toFixed(1)+'×'}<span class="${ratio>1?'bad':''}">${mark}</span></td></tr>`;
  }).join('');
  return `<h1>Murder versus drug-poisoning</h1>
    ${table(['Year','UCR murders','NVSS poisoning','Poisoning / murder'],rows)}
    <div class="note">Different units of observation (offense vs death certificate). Do not sum. 1980 poisoning is post–ICD-9 and not comparable to 1978.</div>`;
},
fent(){
  $('side').innerHTML='';
  const ys=[2013,2015,2017,2020,2022,2025];
  const rows=ys.map(y=>{
    const s=SYN[y],o=oOf(y);
    return `<tr><td>${y}</td><td>${s?fmt(s):'—'}</td><td>${s&&o?(100*s/o[1]).toFixed(0)+'%':'—'}</td></tr>`;
  }).join('');
  return `<h1>Synthetic opioids other than methadone (T40.4)</h1>
    <p>Mostly illicit fentanyl and analogues. Multiple-cause mentions: a death can contribute to T40.4 and to the all-drug total.</p>
    ${table(['Year','T40.4 mentions','Share of all poisoning'],rows)}
    <p>Share = T40.4 ÷ all-drug row. Not a partition of mutually exclusive deaths.</p>`;
},
covid(){
  sideYears(1918,2026,1);
  return `<h1>COVID-19 and excess mortality</h1>
    <div class="warn"><b>No CDC publication states “0 excess deaths in 2025.”</b> Three non-equivalent estimators: (A) versus a U.S. expected baseline — 2025 age-adjusted 689.2 &lt; 2019 715.2 ⇒ deficit, not a counted zero. (B) versus other high-income countries (JAMA Health Forum 2025) — 705,331 in <b>2023</b> and 631,247 already in <b>2019</b>; 2025 not estimated. (C) raw counts 3.09M (2025) versus 2.85M (2019) ≈ +240k registrations, largely population aging. Do not add COVID + excess.</div>
    <h2>Certificate COVID (NVSS)</h2>
    ${table(['Year','Involving','All-cause','Share',{t:'Note',l:1}],
      `<tr class="pk"><td>2020</td><td>350,831</td><td>3,383,729</td><td>10.4%</td><td class="l">Third leading cause. All-cause +19% vs 2019.</td></tr>
       <tr class="pk"><td>2021</td><td>416,893</td><td>3,464,231</td><td>12.0%</td><td class="l">Maximum involving year.</td></tr>
       <tr><td>2022</td><td>245,614</td><td>3,279,857</td><td>7.5%</td><td class="l">MMWR. Underlying ≈186,702.</td></tr>
       <tr><td>2023</td><td>76,446</td><td>3,090,964</td><td>2.5%</td><td class="l">Final. Underlying 49,928. 10th leading cause.</td></tr>
       <tr><td>2024</td><td>31,426*</td><td>3,072,666</td><td>1.0%</td><td class="l">*Underlying only (Data Brief 548). Age-adj. 722.1.</td></tr>
       <tr><td>2025</td><td>—</td><td>3,094,593</td><td>—</td><td class="l">Provisional. Age-adj. 689.2, lowest recorded.</td></tr>
       <tr class="hi"><td>2026</td><td>—</td><td>—</td><td>—</td><td class="l">Incomplete. Weekly all-cause still issued.</td></tr>`)}
    <p>Involving 2020–23 ≈ <b>1.09M</b>. Cumulative tallies near 1.24M use a different cutoff and are not this series.</p>
    <canvas id="ccov"></canvas>
    <h2>Estimator A — excess versus U.S. expected</h2>
    ${table(['Year','Excess',{t:'Source',l:1}],
      `<tr class="pk"><td>2020</td><td>≈480,000</td><td class="l">OWID U.S. baseline</td></tr>
       <tr class="pk"><td>2021</td><td>≈460,000</td><td class="l">same family (some papers to ≈586k)</td></tr>
       <tr><td>2022</td><td>≈250,000</td><td class="l">same family</td></tr>
       <tr><td>2023</td><td>≈80,000</td><td class="l">RGA later 3.2% ≈ 99k</td></tr>
       <tr><td>2024</td><td>≈12,300</td><td class="l">RGA 0.4% of 3,072,666 — not an NVSS total</td></tr>
       <tr><td>2025</td><td>unpublished</td><td class="l">age-adj. 689.2 &lt; 715.2 ⇒ <b>deficit</b></td></tr>
       <tr><td>2026</td><td>open</td><td class="l">registration continues</td></tr>`)}
    <canvas id="cex"></canvas>
    <h2>Estimator B — versus other high-income countries (JAMA 2025)</h2>
    ${table(['Year','U.S. excess vs HICs'],
      `<tr><td>2019</td><td>631,247 (pre-pandemic gap)</td></tr>
       <tr class="pk"><td>2020</td><td>1,008,369</td></tr>
       <tr class="pk"><td>2021</td><td>1,098,808</td></tr>
       <tr><td>2022</td><td>820,396</td></tr>
       <tr><td>2023</td><td>705,331 (≈23% of U.S. deaths)</td></tr>
       <tr><td>2024–26</td><td>not published</td></tr>`)}
    <p>Extrapolating 2023’s peer gap into 2025 is not an estimate. It is an assumption.</p>
    <canvas id="cpeer"></canvas>
    <h2>1918 influenza versus COVID-19</h2>
    ${table([{t:'',l:1},'1918–19 influenza','COVID 2020–25'],
      `<tr><td class="l">U.S. pandemic deaths</td><td>≈675,000</td><td>≈1.2 million certified</td></tr>
       <tr><td class="l">Population</td><td>≈103 million</td><td>≈331 million</td></tr>
       <tr><td class="l">Deaths /100k</td><td>≈650</td><td>≈360</td></tr>
       <tr><td class="l">Age pattern</td><td>W-shaped; young adults</td><td>concentrated at 65+</td></tr>`)}
    <div class="note">Typical seasonal influenza is ≈10–50k U.S. deaths and is not entered as excess here except 1918–20. 1957 and 1968 pandemics were real and far smaller.</div>`;
},
method(){
  $('side').innerHTML='';
  return `<h1>Methods</h1>
    <ul>
      <li><b>Population.</b> Midyear / average Census population (thousands). Crude rate = registered or estimated deaths ÷ population × 100,000. Not the NCHS year-2000 age-adjusted rate (2025 aa 689.2 versus crude ≈905).</li>
      <li><b>All-cause.</b> 1900–32: published national estimates, rounded to thousands; death-registration area incomplete — not equivalent to later NVSS coverage. 1933–2024: NVSS resident registrations (<i>Deaths: Final Data</i>, Data Briefs). 2019 kept at final 2,854,838. 2023 final 3,090,964. 2025 provisional 3,094,593. 2026 unpublished. Not UN WPP.</li>
      <li><b>UCR murder.</b> Police-reported murder / non-negligent manslaughter. National estimates from 1936. 1960s counts reconstructed rate × population (rounded). 2023–24 counts rounded from published percent changes onto the 2025 official 14,085. 2021 NIBRS transition reduces comparability.</li>
      <li><b>NVSS homicide.</b> Certificate underlying-cause homicide. Usually exceeds UCR murder (coverage and definition).</li>
      <li><b>Drug-poisoning.</b> ICD-10 X40–X44, X60–X64, X85, Y10–Y14. Level-shifts at <b>1979 (ICD-9)</b> and <b>1999 (ICD-10)</b>. 2026 calendar YTD is not observed; Feb 2026 12-month window is.</li>
      <li><b>T40.4.</b> Synthetic opioids other than methadone, multiple-cause. Overlaps the all-drug total.</li>
      <li><b>COVID-involving</b> (U07.1 anywhere) ≠ underlying-only. 2022: 245,614 involving / ≈186,702 underlying. 2023: 76,446 / 49,928. 2024 figure stored here is underlying.</li>
      <li><b>Excess</b> is baseline-dependent. 2020–23: OWID/CDC-style versus U.S. expected. 2024: RGA 0.4% of 3,072,666. 2025 unpublished on that ruler. JAMA HIC-peer series is a separate contrast and is already large in 2019.</li>
      <li><b>1918–20.</b> CDC ≈675k U.S. influenza deaths over the pandemic; annual split is an allocation, not a vital-statistics line.</li>
      <li><b>Scope.</b> Mortality series only. No private names. No attribution to parties, administrations, or immigration status.</li>
    </ul>`;
},
src(){
  $('side').innerHTML='';
  return `<h1>Sources</h1>
    <ul>
      <li>FBI UCR / Crime in the United States; 2025 national tables (Aug 2026) — rate 4.1, count 14,085 (−18.1%)</li>
      <li>NCHS WONDER and Data Briefs — drug-poisoning 1968–2024 final (2024 = 79,384; age-adj. 23.1)</li>
      <li>CDC provisional poisoning dashboard, 4 Aug 2026 — 12 months ending Feb 2026 = 68,641</li>
      <li>Disaster Center / CRS UCR rate reconstructions, 1960–2019</li>
      <li>NVSS / NVSR <i>Deaths: Final Data</i> and Data Briefs — resident all-cause 1933–2024; 2025 provisional</li>
      <li>NCHS / Census / Historical Statistics — 1900–32 national death estimates (DRA incomplete)</li>
      <li>Census midyear / average population — crude-rate denominator</li>
      <li>CDC excess-deaths dashboard / OWID U.S. excess (2020–22)</li>
      <li>CDC 1918 pandemic history (≈675,000 U.S.)</li>
      <li>JAMA Health Forum 2025 — U.S. versus other high-income countries</li>
    </ul>
    <p>Single static file. No network after load. Canvas figures. Chromium, Firefox, Safari.</p>`;
}
};

function hdrH(){
  const h=$('nav')&&$('nav').parentElement;
  document.documentElement.style.setProperty('--hdr', (h?Math.ceil(h.getBoundingClientRect().height):52)+'px');
}
function toTop(){
  try{scrollTo(0,0)}catch(e){}
  if(document.documentElement) document.documentElement.scrollTop=0;
  if(document.body) document.body.scrollTop=0;
}
function afterPaint(){
  hdrH();
  requestAnimationFrame(function(){ requestAnimationFrame(paint); });
}
function go(p){
  if(!PAGES[p]) p='home';
  $('pane').innerHTML=PAGES[p]();
  toTop();
  for(const a of $('nav').querySelectorAll('a[data-go]')) a.classList.toggle('on',a.dataset.go===p);
  afterPaint();
  document.title=(NAV.find(n=>n[0]===p)||[, 'US'])[1]+' · US mortality';
}
function yr(y){
  y=+y; if(!y||y<1900||y>2026){location.hash='home';return}
  const m=mOf(y),o=oOf(y),a=ac(y),r=acr(y);
  sideYears(1900,2026,1);
  for(const a of $('nav').querySelectorAll('a[data-go]')) a.classList.remove('on');
  $('pane').innerHTML=`<h1>${y}</h1>${cards([
    ['All-cause',a?fmt(a):'—',a?acTag(y):'no annual total'],
    ['Crude /100k',r?r.toFixed(0):'—','not age-standardized'],
    ['COVID-involving',y<2020?0:fmt(COVID[y]),'U07.1'],
    ['Excess vs U.S.',EXCESS[y]!=null?fmt(EXCESS[y]):(y<2020?0:'—'),'not vs HICs'],
    ['UCR murder rate',m&&m[1]!=null?m[1].toFixed(1):'—',m&&m[2]!=null?fmt(m[2]):''],
    ['Drug-poisoning',o?fmt(o[1])+(y===2026?'*':''):'—',o&&o[2]!=null?'rate '+o[2]:''],
    ['T40.4 / violence',fmt(SYN[y]),'UCR viol. '+ (VIO[y]??'—')]
  ])}<div class="note">${note(y)||(y<1933?'Pre-1933 all-cause is a national estimate; the death-registration area did not cover all states.':'No special flag.')}</div>
    <p><a data-go="five">Annual file</a> · <a data-go="murder">UCR</a> · <a data-go="od">Poisoning</a></p>`;
  toTop();
  afterPaint();
  document.title=y+' · US mortality';
}
function route(){const h=location.hash.slice(1);h.startsWith('y/')?yr(h.slice(2)):go(h||'home')}
function jump(h){ if(location.hash.slice(1)===h) route(); else location.hash=h; }
$('nav').innerHTML=NAV.map(([id,lab])=>`<a href="#${id}" data-go="${id}">${lab}</a>`).join('')+
  '<input id="q" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go" placeholder="year" aria-label="Year" maxlength="4" autocomplete="off">';
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-go],[data-yr]');
  if(!a) return;
  e.preventDefault();
  jump(a.dataset.go||('y/'+a.dataset.yr));
});
$('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); jump('y/'+$('q').value.replace(/\D/g,'')); }
});
addEventListener('hashchange',route);
function onView(){ clearTimeout(window._rz); window._rz=setTimeout(function(){ hdrH(); paint(); },120); }
addEventListener('resize',onView);
if(window.visualViewport) visualViewport.addEventListener('resize',onView);
document.addEventListener('wheel',e=>{
  if(e.ctrlKey||Math.abs(e.deltaY)<Math.abs(e.deltaX)) return;
  if(window.matchMedia && matchMedia('(max-width:800px)').matches) return;
  const box=e.target.closest('#side');
  if(!box) return;
  const max=box.scrollHeight-box.clientHeight;
  if(max<=1||(box.scrollTop<=0&&e.deltaY<0)||(box.scrollTop>=max-1&&e.deltaY>0)){
    scrollBy(0,e.deltaY);
    e.preventDefault();
  }
},{passive:false,capture:true});
route();
</script>
</body>
</html>
