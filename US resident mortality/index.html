wPois:{en:'Underlying ICD-10 X40–X44, X60–X64, X85, Y10–Y14. Violet rows are revision breaks (ICD-9 1979; ICD-10 1999), not biological discontinuities. T40.4 is a multiple-cause mention. CDR here is crude, not NCHS AA (2024 AA = 23.1).',fr:'Cause initiale CIM-10 X40–X44, X60–X64, X85, Y10–Y14. Violet = ruptures de classification (1979, 1999), pas une chute biologique. T40.4 est une mention à causes multiples. TBM ici = brute, pas le TSA NCHS (2024 TSA = 23,1).',hu:'Alapok BNO-10 X40–X44, X60–X64, X85, Y10–Y14. Lila: kódváltás (1979, 1999). T40.4 többszörös említés. Itt CDR nyers, nem NCHS AA (2024 AA = 23,1).',ro:'Cauză de bază CIM-10 X40–X44, X60–X64, X85, Y10–Y14. Violet: rupturi de clasificare (1979, 1999). T40.4 e mențiune multiplă. CDR aici e brut, nu AA NCHS (2024 AA = 23,1).',de:'Grundleiden ICD-10 X40–X44, X60–X64, X85, Y10–Y14. Violett: Revisionsbrüche (1979, 1999). T40.4 ist Mehrfachnennung. CDR hier roh, nicht NCHS-AA (2024 AA = 23,1).',es:'Causa básica CIE-10 X40–X44, X60–X64, X85, Y10–Y14. Violeta: cortes de revisión (1979, 1999). T40.4 es mención múltiple. CDR aquí es bruta, no AA NCHS (2024 AA = 23,1).',pt:'Causa básica CID-10 X40–X44, X60–X64, X85, Y10–Y14. Violeta = ruturas de classificação (1979, 1999), não uma queda biológica. T40.4 é menção de causas múltiplas. TBM aqui é bruta, não AA NCHS (2024 AA = 23,1).',pl:'Przyczyna wyjściowa ICD-10 X40–X44, X60–X64, X85, Y10–Y14. Fiolet: pęknięcia klasyfikacji (1979, 1999), nie załamanie biologiczne. T40.4 to wzmianka wieloprzyczynowa. SWZ tu jest surowy, nie AA NCHS (2024 AA = 23,1).'},

p26:{en:'Calendar 2026 is unpublished (≈4-month lag). Predicted 12 months ending Feb 2026 = 68,641 — a window, not a year.',fr:'L’année civile 2026 n’est pas publiée (≈4 mois de décalage). Fenêtre de 12 mois finissant en févr. 2026 = 68 641 — une fenêtre, pas une année.',hu:'A 2026-os naptári év nincs közzétéve (≈4 hónap késés). 12 hónap 2026. febr.-ig = 68 641 — ablak, nem év.',ro:'Anul calendaristic 2026 nu e publicat (≈4 luni). Fereastra de 12 luni până feb. 2026 = 68.641 — o fereastră, nu un an.',de:'Kalenderjahr 2026 unveröffentlicht (≈4 Monate). 12 Monate bis Feb. 2026 = 68.641 — ein Fenster, kein Jahr.',es:'El año 2026 no está publicado (≈4 meses). Ventana de 12 meses hasta feb. 2026 = 68.641 — una ventana, no un año.',pt:'O ano civil 2026 não está publicado (≈4 meses de atraso). Janela de 12 meses até fev. 2026 = 68.641 — uma janela, não um ano.',pl:'Rok kalendarzowy 2026 nieopublikowany (≈4 miesiące opóźnienia). Okno 12 miesięcy do lut. 2026 = 68 641 — okno, nie rok.'},

nAnn:{en:'All-cause only, 1900–2025. CDR = D/P×10⁵, not year-2000 AA. 1900–32 national estimates (DRA incomplete). 1933–2024 NVSS registered. 2025 provisional. Murder, poisoning, U07.1 and excess have their own pages and start years.',fr:'Toutes causes seulement, 1900–2025. TBM = D/P×10⁵, pas le TSA 2000. 1900–32 estimations nationales. 1933–2024 NVSS enregistré. 2025 provisoire. Meurtre, intoxication, U07.1 et surmortalité ont leurs propres pages.',hu:'Csak minden ok, 1900–2025. CDR = D/P×10⁵, nem AA. 1900–32 becslés. 1933–2024 NVSS. 2025 előzetes. A többi sor külön lapon.',ro:'Doar toate cauzele, 1900–2025. CDR = D/P×10⁵, nu AA. 1900–32 estimări. 1933–2024 NVSS. 2025 provizoriu. Celelalte serii pe pagini proprii.',de:'Nur alle Ursachen, 1900–2025. CDR = D/P×10⁵, nicht AA. 1900–32 Schätzungen. 1933–2024 NVSS. 2025 vorläufig. Andere Reihen auf eigenen Seiten.',es:'Solo todas las causas, 1900–2025. CDR = D/P×10⁵, no AA. 1900–32 estimaciones. 1933–2024 NVSS. 2025 provisional. Las demás series en sus páginas.',pt:'Só todas as causas, 1900–2025. TBM = D/P×10⁵, não AA 2000. 1900–32 estimativas nacionais. 1933–2024 NVSS registado. 2025 provisório. Assassinato, intoxicação, U07.1 e excesso têm as suas próprias páginas.',pl:'Tylko wszystkie przyczyny, 1900–2025. SWZ = D/P×10⁵, nie AA 2000. 1900–32 szacunki krajowe. 1933–2024 NVSS zarejestrowane. 2025 wstępne. Morderstwo, zatrucie, U07.1 i nadumieralność mają własne strony.'},

w0:{en:'U07.1 exists from 2020. XA is a U.S.-expected residual (OWID/RGA), 2020–24 only. XB is U.S. vs other high-income countries (Bor et al. 2025), 2019–23; 2019 is a pre-pandemic baseline, not COVID. Do not add U07.1 + XA + XB. 2025 has no CDC “0 excess” year-total. 1918 influenza is all-cause, not this page.',fr:'U07.1 existe à partir de 2020. XA = résidu vs un attendu américain (OWID/RGA), 2020–24 seulement. XB = É.-U. vs autres pays à revenu élevé (Bor et al. 2025), 2019–23 ; 2019 est une base pré-pandémique, pas la COVID. Ne pas additionner U07.1 + XA + XB. 2025 n’a pas de total CDC « 0 excès ». La grippe de 1918 est toutes causes, pas cette page.',hu:'U07.1 2020-tól. XA csak 2020–24. XB 2019–23 (2019 a járvány előtti alap). Ne adjuk össze. Az 1918-as influenza nem ez a lap.',ro:'U07.1 din 2020. XA doar 2020–24. XB 2019–23 (2019 e baza pre-pandemică). Nu însumați. Gripa 1918 nu e această pagină.',de:'U07.1 ab 2020. XA nur 2020–24. XB 2019–23 (2019 ist Vor-Pandemie). Nicht addieren. Grippe 1918 ist nicht diese Seite.',es:'U07.1 desde 2020. XA solo 2020–24. XB 2019–23 (2019 es la base prepandémica). No sume. La gripe de 1918 no es esta página.',pt:'U07.1 existe a partir de 2020. XA é um residual vs o esperado nos EUA (OWID/RGA), só 2020–24. XB é EUA vs outros países de alta renda (Bor et al. 2025), 2019–23; 2019 é a base pré-pandémica, não COVID. Não some U07.1 + XA + XB. 2025 não tem total CDC «0 excesso». A gripe de 1918 é todas as causas, não esta página.',pl:'U07.1 istnieje od 2020. XA to residuum vs oczekiwane USA (OWID/RGA), tylko 2020–24. XB to USA vs inne kraje o wysokich dochodach (Bor et al. 2025), 2019–23; 2019 to baza przedpandemiczna, nie COVID. Nie dodawaj U07.1 + XA + XB. 2025 nie ma rocznego CDC „0 nadwyżki”. Grypa 1918 to wszystkie przyczyny, nie ta strona.'},

mAc:{en:'All-cause (D). 1900–32 published national estimates (Death Registration Area incomplete). 1933–2024 NVSS registered resident deaths. 2019 final 2,854,838. 2023 final 3,090,964. 2024 final 3,072,666. 2025 provisional 3,094,593 (VSRR 44). 2026 unpublished. Not UN WPP.',fr:'Toutes causes (D). 1900–32 estimations nationales (zone d’enregistrement incomplète). 1933–2024 décès de résidents NVSS. 2019 final 2 854 838. 2023 3 090 964. 2024 3 072 666. 2025 provisoire 3 094 593 (VSRR 44). 2026 non publié. Pas UN WPP.',hu:'Minden ok (D). 1900–32 nemzeti becslés (DRA hiányos). 1933–2024 NVSS. 2019 2 854 838. 2023 3 090 964. 2024 3 072 666. 2025 előzetes 3 094 593 (VSRR 44). 2026 nincs. Nem UN WPP.',ro:'Toate cauzele (D). 1900–32 estimări naționale (DRA incomplet). 1933–2024 NVSS. 2019 2.854.838. 2023 3.090.964. 2024 3.072.666. 2025 provizoriu 3.094.593 (VSRR 44). 2026 nepublicat. Nu UN WPP.',de:'Alle Ursachen (D). 1900–32 nationale Schätzungen (DRA unvollständig). 1933–2024 NVSS. 2019 2.854.838. 2023 3.090.964. 2024 3.072.666. 2025 vorläufig 3.094.593 (VSRR 44). 2026 unveröffentlicht. Nicht UN WPP.',es:'Todas las causas (D). 1900–32 estimaciones nacionales (DRA incompleta). 1933–2024 NVSS. 2019 2.854.838. 2023 3.090.964. 2024 3.072.666. 2025 provisional 3.094.593 (VSRR 44). 2026 inédito. No UN WPP.',pt:'Todas as causas (D). 1900–32 estimativas nacionais (área de registo incompleta). 1933–2024 óbitos de residentes NVSS. 2019 final 2.854.838. 2023 3.090.964. 2024 3.072.666. 2025 provisório 3.094.593 (VSRR 44). 2026 não publicado. Não UN WPP.',pl:'Wszystkie przyczyny (D). 1900–32 szacunki krajowe (obszar rejestracji niepełny). 1933–2024 zgony mieszkańców NVSS. 2019 końcowe 2 854 838. 2023 3 090 964. 2024 3 072 666. 2025 wstępne 3 094 593 (VSRR 44). 2026 nieopublikowane. Nie UN WPP.'},
mAa:{en:'Age-adjusted (AA). Year-2000 U.S. standard million. Separate construct from CDR. 2019 = 715.2; 2023 = 750.5; 2024 = 722.1; 2025 = 689.2 (lowest recorded; provisional). A falling AA with a rising D is consistent with growth and aging.',fr:'Taux standardisé sur l’âge (TSA / AA). Population type des É.-U. 2000. Construit distinct de la TBM. 2019 = 715,2 ; 2023 = 750,5 ; 2024 = 722,1 ; 2025 = 689,2 (plus bas enregistré ; provisoire). Un TSA en baisse avec un D en hausse est compatible avec la croissance et le vieillissement.',hu:'Korszerűsített (AA). 2000-es USA-standard. Külön konstruktum. 2019 = 715,2; 2025 = 689,2 (rekordalacsony; előzetes).',ro:'Standardizat pe vârstă (AA). Standard SUA 2000. Construct separat. 2019 = 715,2; 2025 = 689,2 (minim record; provizoriu).',de:'Altersstandardisiert (AA). US-Standard 2000. Anderes Konstrukt als CDR. 2019 = 715,2; 2025 = 689,2 (Rekordtief; vorläufig).',es:'Ajustada por edad (AA). Estándar EE.UU. 2000. Constructo distinto. 2019 = 715,2; 2025 = 689,2 (mínimo registrado; provisional).',pt:'Taxa ajustada por idade (AA). Padrão EUA 2000. Construto distinto da TBM. 2019 = 715,2; 2023 = 750,5; 2024 = 722,1; 2025 = 689,2 (mínimo registado; provisório). AA a descer com D a subir é compatível com crescimento e envelhecimento.',pl:'Współczynnik standaryzowany wiekiem (AA). Standard USA 2000. Inny konstrukt niż SWZ. 2019 = 715,2; 2023 = 750,5; 2024 = 722,1; 2025 = 689,2 (najniższe odnotowane; wstępne). Spadające AA przy rosnącym D jest zgodne ze wzrostem i starzeniem.'},
mUcr:{en:'UCR murder. Murder and nonnegligent manslaughter known to police. Not NVSS homicide (ICD). 2021 NIBRS transition reduces intertemporal comparability. 2025 rate 4.1 ties 1955–56.',fr:'Meurtre UCR. Meurtre et homicide volontaire non négligent connus de la police. Pas l’homicide NVSS (CIM). La transition NIBRS 2021 réduit la comparabilité. Taux 2025 : 4,1 (égal à 1955–56).',hu:'UCR-gyilkosság. Rendőrségnek ismert. Nem NVSS-emberölés. 2021 NIBRS rontja az összevethetőséget.',ro:'Omor UCR. Raportat de poliție. Nu omicid NVSS. NIBRS 2021 reduce comparabilitatea.',de:'UCR-Mord. Polizeilich bekannt. Nicht NVSS-Tötung. NIBRS 2021 mindert Vergleichbarkeit.',es:'Asesinato UCR. Conocido por la policía. No homicidio NVSS. NIBRS 2021 reduce comparabilidad.',pt:'Assassinato UCR. Assassinato e homicídio doloso não negligente conhecidos da polícia. Não é o homicídio NVSS (CID). A transição NIBRS 2021 reduz a comparabilidade. Taxa 2025: 4,1 (igual a 1955–56).',pl:'Morderstwo UCR. Morderstwo i nieumyślne wyłączone, znane policji. To nie zabójstwo NVSS (ICD). Przejście NIBRS 2021 zmniejsza porównywalność. Współczynnik 2025: 4,1 (jak 1955–56).'},
mIcd:{en:'Drug-poisoning. ICD-8 from 1968; ICD-9 1979; ICD-10 1999 — classification breaks. 2024 final 79,384; 2025 provisional 69,973; 12 months ending Feb 2026 = 68,641 (window, not calendar 2026). CDR on this page is crude.',fr:'Intoxication. CIM-8 dès 1968 ; CIM-9 1979 ; CIM-10 1999 — ruptures de classification. 2024 final 79 384 ; 2025 provisoire 69 973 ; 12 mois finissant en févr. 2026 = 68 641 (fenêtre, pas l’année 2026). La TBM ici est brute.',hu:'Drogmérgezés. BNO-8 1968; BNO-9 1979; BNO-10 1999. 2024 79 384; 2025 69 973; 12 hónap 2026. febr.-ig = 68 641.',ro:'Intoxicație. CIM-8 din 1968; CIM-9 1979; CIM-10 1999. 2024 79.384; 2025 69.973; 12 luni până feb. 2026 = 68.641.',de:'Drogenvergiftung. ICD-8 ab 1968; ICD-9 1979; ICD-10 1999. 2024 79.384; 2025 69.973; 12 Monate bis Feb. 2026 = 68.641.',es:'Intoxicación. CIE-8 desde 1968; CIE-9 1979; CIE-10 1999. 2024 79.384; 2025 69.973; 12 meses hasta feb. 2026 = 68.641.',pt:'Intoxicação. CID-8 desde 1968; CID-9 1979; CID-10 1999 — ruturas de classificação. 2024 final 79.384; 2025 provisório 69.973; 12 meses até fev. 2026 = 68.641 (janela, não o ano 2026). A TBM nesta página é bruta.',pl:'Zatrucie. ICD-8 od 1968; ICD-9 1979; ICD-10 1999 — pęknięcia klasyfikacji. 2024 końcowe 79 384; 2025 wstępne 69 973; 12 miesięcy do lut. 2026 = 68 641 (okno, nie rok 2026). SWZ na tej stronie jest surowy.'},
mCov:{en:'COVID-19. ICD-10 U07.1 from 2020 only. Involving = any mention. Underlying = originating cause. 2024 shown as underlying (31,426). Do not add U07.1 to XA.',fr:'COVID-19. CIM-10 U07.1 à partir de 2020 seulement. Mentionnée = toute mention. Cause initiale = origine. 2024 indiqué en cause initiale (31 426). Ne pas ajouter U07.1 à XA.',hu:'COVID-19. BNO-10 U07.1 2020-tól. Involving = bármely említés. Alapok = kiinduló ok. 2024 alapok 31 426.',ro:'COVID-19. CIM-10 U07.1 din 2020. Involving = orice mențiune. Cauză de bază = originea. 2024 cauză de bază 31.426.',de:'COVID-19. ICD-10 U07.1 ab 2020. Involving = jede Nennung. Grundleiden = Ausgangsursache. 2024 Grundleiden 31.426.',es:'COVID-19. CIE-10 U07.1 desde 2020. Involving = cualquier mención. Causa básica = origen. 2024 causa básica 31.426.',pt:'COVID-19. CID-10 U07.1 só a partir de 2020. Mencionada = qualquer menção. Causa básica = origem. 2024 indicado como causa básica (31.426). Não some U07.1 a XA.',pl:'COVID-19. ICD-10 U07.1 dopiero od 2020. Wymieniona = każda wzmianka. Przyczyna wyjściowa = źródło. 2024 jako przyczyna wyjściowa (31 426). Nie dodawaj U07.1 do XA.'},
mEx:{en:'Excess. XA = residual vs a U.S. expected baseline (OWID / RGA); 2020–24; method-dependent. XB = U.S. vs other high-income countries (Bor et al. 2025); 2019–23 only. Missing XA is not zero. 1918 influenza is not XA.',fr:'Surmortalité. XA = résidu vs un attendu américain (OWID / RGA) ; 2020–24 ; dépend de la méthode. XB = É.-U. vs autres pays à revenu élevé (Bor et al. 2025) ; 2019–23 seulement. Une XA manquante n’est pas zéro. La grippe de 1918 n’est pas XA.',hu:'Többlet. XA = maradék egy USA-várthoz (OWID/RGA); 2020–24. XB = USA vs más HIC (Bor et al. 2025); csak 2019–23. A hiányzó XA nem nulla.',ro:'Exces. XA = reziduu față de un așteptat SUA (OWID/RGA); 2020–24. XB = SUA vs alte HIC (Bor et al. 2025); doar 2019–23. XA lipsă nu e zero.',de:'Übersterblichkeit. XA = Residual vs. US-Erwartung (OWID/RGA); 2020–24. XB = USA vs. andere HIC (Bor et al. 2025); nur 2019–23. Fehlendes XA ist nicht null.',es:'Exceso. XA = residual frente a un esperado EE.UU. (OWID/RGA); 2020–24. XB = EE.UU. frente a otros HIC (Bor et al. 2025); solo 2019–23. XA ausente no es cero.',pt:'Excesso. XA = residual vs um esperado EUA (OWID / RGA); 2020–24; depende do método. XB = EUA vs outros países de alta renda (Bor et al. 2025); só 2019–23. XA em falta não é zero. A gripe de 1918 não é XA.',pl:'Nadumieralność. XA = residuum vs oczekiwane USA (OWID / RGA); 2020–24; zależy od metody. XB = USA vs inne kraje o wysokich dochodach (Bor et al. 2025); tylko 2019–23. Brak XA to nie zero. Grypa 1918 to nie XA.'},

function sideYears(a,b,s){let h='<h4>'+t('yr')+'</h4>';for(let y=a;y<=b;y+=s)h+=`<button type="button" data-yr="${y}">${y}</button>`;$('side').innerHTML=h}
function draw(id,years,series,ymax,unit,marks){
  const c=$(id); if(!c||!years.length) return;
  const cssW=c.getBoundingClientRect().width||(c.parentNode&&c.parentNode.clientWidth)||0;
  const dpr=Math.min(window.devicePixelRatio||1,2.5),W=Math.max(cssW,280),n=years.length,H=200;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';
  const g=c.getContext('2d'); g.scale(dpr,dpr);
  const Lft=44,T=16,R=36,B=36,w=W-Lft-R,h=H-T-B,den=Math.max(1,n-1);
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  g.strokeStyle='#e5e7eb';g.beginPath();g.moveTo(Lft,T);g.lineTo(Lft,T+h);g.lineTo(Lft+w,T+h);g.stroke();
  g.font='10px system-ui';
  for(let i=0;i<=4;i++){
    const yy=T+h*i/4,v=ymax*(1-i/4);
    g.strokeStyle='#f3f4f6';g.beginPath();g.moveTo(Lft,yy);g.lineTo(Lft+w,yy);g.stroke();
    g.fillStyle='#6b7280';g.textAlign='right';g.fillText(v>=100?Math.round(v):v.toFixed(v>=10?0:1),Lft-6,yy+3);
  }
  if(marks) marks.forEach(function(my){
    const i=years.indexOf(my); if(i<0) return;
    const x=Lft+w*i/den;
    g.strokeStyle='#c4b5fd';g.setLineDash([3,3]);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+h);g.stroke();g.setLineDash([]);
  });
  const st=n<=14?1:n<=30?2:n<=80?5:10;
  years.forEach((y,i)=>{
    if(i%st&&i&&i!==n-1) return;
    g.save();g.translate(Lft+w*i/den,T+h+13);g.rotate(-.35);
    g.fillStyle='#374151';g.textAlign=i===0?'left':i===n-1?'right':'center';g.fillText(String(y),0,0);g.restore();
  });
  series.forEach(S=>{
    g.strokeStyle=S.c||COL.o;g.lineWidth=S.w||1.8;g.lineJoin='round';g.beginPath();
    let started=0;
    S.s.forEach((v,i)=>{
      if(v==null){started=0;return}
      const x=Lft+w*i/den,yy=T+h*(1-Math.max(0,v)/ymax);
      if(!started){g.moveTo(x,yy);started=1}else g.lineTo(x,yy);
    });
    g.stroke();
    if(n<=20) S.s.forEach((v,i)=>{if(v==null)return;g.fillStyle=S.c||COL.o;g.beginPath();g.arc(Lft+w*i/den,T+h*(1-Math.max(0,v)/ymax),2.1,0,7);g.fill()});
  });
  g.fillStyle='#6b7280';g.textAlign='left';g.fillText(unit||'',Lft,12);
}
function paint(){

  draw('co',OD.map(r=>r[0]),[{s:OD.map(r=>ocr(r[0])),c:COL.o}],40,t('uOd'),[1979,1999]);
  draw('c4',y15,[{s:y15.map(y=>cdr(y)||0),c:COL.k}],1200,t('uAc'));
  draw('cac',acY,[{s:ACx.map((d,i)=>d/POPk[i]*100),c:COL.k,w:1.35}],1900,t('uAc'));
  const yC=[2020,2021,2022,2023,2024];
  draw('ccov',yC,[{s:yC.map(y=>((COVID[y]||COVu[y])||0)/1e3),c:COL.v}],450,t('uCov'));
  draw('cex',yC,[{s:yC.map(y=>EXCESS[y]/1e3),c:COL.x,w:2}],520,t('uEx'));
  const yP=[2019,2020,2021,2022,2023];
  draw('cpeer',yP,[{s:yP.map(y=>PEER[y]/1e3),c:'#9d174d',w:2}],1200,t('uPeer'));
}

    const p=i?M[i-1][1]:null,d=p==null?'':((r[1]-p>=0?'+':'')+(r[1]-p).toFixed(1));
    const cls=r[1]>=10?'pk':r[1]<=4.2?'lo':(r[0]===2020||r[0]===2021)?'hi':'';
    rows+=`<tr class="${cls}"><td><a data-yr="${r[0]}">${r[0]}</a></td><td>${r[1].toFixed(1)}</td><td>${fmt(r[2])}</td><td>${d}</td></tr>`;
  });
  return `<h1>${t('hUcr')}</h1><div class="warn">${t('wUcr')}</div>${table([t('yr'),t('thRate'),t('thCnt'),t('thD')],rows)}`;
},
od(){
  sideYears(1968,2025,1);
  let rows='';
  OD.forEach(r=>{
    const cls=r[0]===1979||r[0]===1999?'br':r[1]>1e5?'pk':r[0]>=2023?'lo':'';
    rows+=`<tr class="${cls}"><td><a data-yr="${r[0]}">${r[0]}</a></td><td>${fmt(r[1])}</td><td>${ocr(r[0]).toFixed(1)}</td><td>${SYN[r[0]]?fmt(SYN[r[0]]):'—'}</td></tr>`;
  });
  const ys=[1999,2010,2013,2015,2017,2019,2020,2022,2024,2025];
  const trows=ys.map(y=>{const s=SYN[y],o=oOf(y);return `<tr><td>${y}</td><td>${fmt(s)}</td><td>${s&&o?(100*s/o[1]).toFixed(0)+'%':'—'}</td></tr>`}).join('');
  return `<h1>${t('hPois')}</h1><div class="warn">${t('wPois')}</div>${table([t('yr'),t('thDth'),'CDR','T40.4'],rows)}<p>${t('p26')}</p>
    <h2>${t('hT')}</h2><p>${t('pT')}</p>${table([t('yr'),'T40.4',t('thSh')],trows)}`;
},
five(){
  sideYears(1900,2025,5);
  let rows='';
  for(let y=1900;y<=2025;y++){
    const r=cdr(y);
    const cls=y===1918||y===2020||y===2021?'pk':y===2025?'hi':'';
    rows+=`<tr class="${cls}"><td><a data-yr="${y}">${y}</a></td><td>${fmt(ac(y))}</td><td>${r?r.toFixed(0):'—'}</td><td>${acTag(y)}</td><td class="l">${note(y)||(y<1933?'DRA':'')}</td></tr>`;
  }
  return `<h1>${t('hAnn')}</h1><div class="note">${t('nAnn')}</div>${table([t('yr'),'D','CDR',t('stat'),{t:t('thNote'),l:1}],rows)}`;
},
compare(){
  sideYears(1970,2025,5);
  const rows=[1970,1980,1990,2000,2010,2015,2020,2022,2025].map(y=>{
    const m=mOf(y),o=oOf(y),ratio=m&&o&&m[2]?(o[1]/m[2]):null;
    return `<tr><td>${y}</td><td>${m?fmt(m[2]):'—'}</td><td>${o?fmt(o[1]):'—'}</td><td>${ratio==null?'—':ratio.toFixed(1)+'×'}</td></tr>`;
  }).join('');
  return `<h1>${t('hCmp')}</h1>${table([t('yr'),'UCR n','NVSS OD','OD/UCR'],rows)}<div class="note">${t('nCmp2')}</div>`;
},
covid(){
  sideYears(2020,2025,1);
  return `<h1>${t('hCov')}</h1><div class="warn">${t('w0')}</div>
    <h2>${t('hCert')}</h2>
    ${table([t('yr'),'U07.1',t('allc'),'%',{t:t('thNote'),l:1}],
      `<tr class="pk"><td>2020</td><td>350,831</td><td>3,383,729</td><td>10.4%</td><td class="l">${t('inv')}</td></tr>
       <tr class="pk"><td>2021</td><td>416,893</td><td>3,464,231</td><td>12.0%</td><td class="l">${t('inv')}</td></tr>
       <tr><td>2022</td><td>245,614</td><td>3,279,857</td><td>7.5%</td><td class="l">${t('inv')} · 186,552</td></tr>
       <tr><td>2023</td><td>76,446</td><td>3,090,964</td><td>2.5%</td><td class="l">${t('inv')} · 49,932</td></tr>
       <tr><td>2024</td><td>31,426</td><td>3,072,666</td><td>1.0%</td><td class="l">${t('undOnly')}</td></tr>
       <tr><td>2025</td><td>—</td><td>3,094,593</td><td>—</td><td class="l">${t('noInv')}</td></tr>`)}
    <canvas id="ccov"></canvas>
    <h2>${t('hA')}</h2>
    ${table([t('yr'),'XA',{t:t('thNote'),l:1}],
      `<tr class="pk"><td>2020</td><td>≈480,000</td><td class="l">OWID</td></tr>
       <tr class="pk"><td>2021</td><td>≈460,000</td><td class="l">OWID</td></tr>
       <tr><td>2022</td><td>≈250,000</td><td class="l">OWID</td></tr>
       <tr><td>2023</td><td>≈80,000</td><td class="l">RGA / OWID</td></tr>
       <tr><td>2024</td><td>≈12,300</td><td class="l">RGA 0.4%</td></tr>
       <tr><td>2025</td><td>—</td><td class="l">${t('unpub')}</td></tr>`)}
    <canvas id="cex"></canvas>
    <h2>${t('hB')}</h2>
    <p>Bor J, et al. JAMA Health Forum. 2025;6(5):e251118. 2019 = ${t('prePan')}.</p>
    ${table([t('yr'),'XB',{t:t('thNote'),l:1}],`<tr><td>2019</td><td>631,247</td><td class="l">${t('prePan')}</td></tr><tr class="pk"><td>2020</td><td>1,008,369</td><td class="l"></td></tr><tr class="pk"><td>2021</td><td>1,098,808</td><td class="l"></td></tr><tr><td>2022</td><td>820,396</td><td class="l"></td></tr><tr><td>2023</td><td>705,331</td><td class="l"></td></tr>`)}
    <canvas id="cpeer"></canvas>`;
},
method(){$('side').innerHTML='';return `<h1>${t('hMet')}</h1>
  <p class="eq">CDR = D / P × 10⁵ · AA ≠ CDR · UCR ≠ NVSS · involving ≠ underlying · XA ≠ XB</p>
  <ul><li>${t('mAc')}</li><li>${t('mAa')}</li><li>${t('mUcr')}</li><li>${t('mIcd')}</li><li>${t('mCov')}</li><li>${t('mEx')}</li><li>${t('mLim')}</li></ul>`;},
src(){$('side').innerHTML='';return `<h1>${t('hSrc')}</h1><p>${t('srcP')}</p>
  <ul>
    <li>FBI UCR 2025 — murder/nonnegligent manslaughter 4.1 / 14,085 (ties 1955–56).</li>
    <li>NCHS FastStats — 2024 NVSS homicide 20,162 (crude 5.9).</li>
    <li>Ahmad FB, Cisewski JA, Anderson RN. Mortality in the United States: Provisional Data, 2025. VSRR 44. 2026. D = 3,094,593; AA = 689.2.</li>
    <li>Xu JQ, et al. Mortality in the United States, 2024. NCHS Data Brief 548. D = 3,072,666; AA = 722.1.</li>
    <li>Murphy SL, et al. Mortality in the United States, 2023. D = 3,090,964.</li>
    <li>NCHS final 2019 — D = 2,854,838; AA = 715.2.</li>
    <li>Garnett MF, et al. Drug Overdose Deaths in the United States, 2023–2024. NCHS Data Brief 549. 2024 final 79,384; AA 23.1.</li>
    <li>NCHS press, 13 May 2026 — 2025 provisional overdose 69,973; T40.4 38,084 (2024 pair 48,913).</li>
    <li>CDC — 12 months ending Feb 2026 predicted 68,641 (window, not calendar year).</li>
    <li>NVSS U07.1 involving 2020–23; 2022–24 underlying as labeled.</li>
    <li>Bor J, et al. Excess US Deaths Before, During, and After the COVID-19 Pandemic. JAMA Health Forum. 2025;6(5):e251118. XB 2019–2023.</li>
    <li>OWID / RGA — XA residuals (U.S. expected), 2020–24. Approximate.</li>
    <li>NCHS historical mortality 1900–1998; DRA national from 1933.</li>
    <li>Census Bureau midyear population estimates.</li>
  </ul>`;}
};
function chrome(){
  document.documentElement.lang=L;
  $('brand').textContent=t('brand');$('sub').textContent=t('sub');$('foot').textContent=t('foot');
  if($('noscript')) $('noscript').textContent=t('ns');
  document.title=t('brand');
  $('langs').innerHTML=LANGS.map(x=>`<button type="button" data-lang="${x[0]}" class="${x[0]===L?'on':''}">${x[1]}</button>`).join('');
  const NAV=[['home',t('nHome')],['charts',t('nCharts')],['murder',t('nMurder')],['od',t('nOd')],['five',t('nYears')],['compare',t('nCmp')],['covid','COVID'],['method',t('nMet')],['src',t('nSrc')]];
  const qv=$('q')?$('q').value:'';
  $('nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" data-go="${n[0]}">${n[1]}</a>`).join('')+
    `<input id="q" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go" placeholder="${t('yr')}" aria-label="${t('yr')}" maxlength="4" autocomplete="off" value="${qv}">`;
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();jump('y/'+$('q').value.replace(/\D/g,''))}});
}
function hdrH(){const h=$('nav')&&$('nav').parentElement;document.documentElement.style.setProperty('--hdr',(h?Math.ceil(h.getBoundingClientRect().height):52)+'px')}
function toTop(){try{scrollTo(0,0)}catch(e){}if(document.documentElement)document.documentElement.scrollTop=0;if(document.body)document.body.scrollTop=0}
function afterPaint(){hdrH();requestAnimationFrame(function(){requestAnimationFrame(paint)})}
function go(p){
  if(p==='fent'){p='od'}
  if(!PAGES[p])p='home';
  $('pane').innerHTML=PAGES[p]();
  toTop();
  for(const a of $('nav').querySelectorAll('a[data-go]'))a.classList.toggle('on',a.dataset.go===p);
  afterPaint();
}
function yr(y){
  y=+y;if(!y||y<1900||y>2025){location.hash='home';return}
  const m=mOf(y),o=oOf(y),a=ac(y),r=cdr(y);
  sideYears(1900,2025,5);
  for(const el of $('nav').querySelectorAll('a[data-go]'))el.classList.remove('on');
  const cs=[[t('allc'),a?fmt(a):'—',a?acTag(y):t('noTot')],[t('crude'),r?r.toFixed(0):'—',t('notAa')]];
  if(AA[y]!=null) cs.push(['AA',AA[y],'year-2000']);
  if(y>=2020&&(COVID[y]!=null||COVu[y]!=null)) cs.push(['U07.1',fmt(COVID[y]||COVu[y]),COVID[y]?t('inv'):t('undOnly')]);
  if(EXCESS[y]!=null) cs.push([t('exU'),fmt(EXCESS[y]),t('notHic')]);
  if(m) cs.push([t('nMurder'),m[1].toFixed(1),fmt(m[2])]);
  if(o) cs.push([t('nOd'),fmt(o[1]),ocr(y).toFixed(1)+' CDR']);
  if(SYN[y]) cs.push(['T40.4',fmt(SYN[y]),'']);
  $('pane').innerHTML=`<h1>${y}</h1>${cards(cs)}<div class="note">${note(y)||(y<1933?t('pre'):t('noFlag'))}</div>
    <p><a data-go="five">${t('nYears')}</a>${y>=2020?' · <a data-go="covid">COVID</a>':''} · <a data-go="method">${t('nMet')}</a></p>`;
  toTop();afterPaint();
}
function route(){const h=location.hash.slice(1);h.startsWith('y/')?yr(h.slice(2)):go(h||'home')}
function jump(h){if(location.hash.slice(1)===h)route();else location.hash=h}
function setLang(x){L=x;try{localStorage.setItem('lang',L)}catch(e){}chrome();route()}
chrome();
document.addEventListener('click',e=>{
  const lang=e.target.closest('[data-lang]'); if(lang){e.preventDefault();setLang(lang.dataset.lang);return}
  const a=e.target.closest('[data-go],[data-yr]'); if(!a) return;
  e.preventDefault(); jump(a.dataset.go||('y/'+a.dataset.yr));
});
addEventListener('hashchange',route);
function onView(){clearTimeout(window._rz);window._rz=setTimeout(function(){hdrH();paint()},120)}
addEventListener('resize',onView);
if(window.visualViewport) visualViewport.addEventListener('resize',onView);
document.addEventListener('wheel',e=>{
  if(e.ctrlKey||Math.abs(e.deltaY)<Math.abs(e.deltaX)) return;
  if(window.matchMedia&&matchMedia('(max-width:800px)').matches) return;
  const box=e.target.closest('#side'); if(!box) return;
  const max=box.scrollHeight-box.clientHeight;
  if(max<=1||(box.scrollTop<=0&&e.deltaY<0)||(box.scrollTop>=max-1&&e.deltaY>0)){scrollBy(0,e.deltaY);e.preventDefault()}
},{passive:false,capture:true});
route();
</script>
</body>
</html>
