wPois:{en:'Underlying ICD-10 X40–X44, X60–X64, X85, Y10–Y14. Violet rows are revision breaks (ICD-9 1979; ICD-10 1999), not biological discontinuities. T40.4 is a multiple-cause mention. CDR here is crude, not NCHS AA (2024 AA = 23.1).',hu:'Alapok BNO-10 X40–X44, X60–X64, X85, Y10–Y14. Lila: kódváltás (1979, 1999). T40.4 többszörös említés. Itt CDR nyers, nem NCHS AA (2024 AA = 23,1).',ro:'Cauză de bază CIM-10 X40–X44, X60–X64, X85, Y10–Y14. Violet: rupturi de clasificare (1979, 1999). T40.4 e mențiune multiplă. CDR aici e brut, nu AA NCHS (2024 AA = 23,1).',de:'Grundleiden ICD-10 X40–X44, X60–X64, X85, Y10–Y14. Violett: Revisionsbrüche (1979, 1999). T40.4 ist Mehrfachnennung. CDR hier roh, nicht NCHS-AA (2024 AA = 23,1).',es:'Causa básica CIE-10 X40–X44, X60–X64, X85, Y10–Y14. Violeta: cortes de revisión (1979, 1999). T40.4 es mención múltiple. CDR aquí es bruta, no AA NCHS (2024 AA = 23,1).'},

nAnn:{en:'All-cause 1900–2025. CDR = D/P×10⁵, not year-2000 AA. 1900–32 national estimates (DRA incomplete). 1933–2024 NVSS registered. 2025 provisional. XA shown only when estimated. Year notes stay in English (source language). UCR violent-crime rates are not mortality and are omitted.',hu:'Minden ok 1900–2025. CDR = D/P×10⁵, nem 2000-es AA. 1900–32 becslés (DRA hiányos). 1933–2024 NVSS. 2025 előzetes. XA csak ha becsült. Az éves megjegyzések angolul maradnak.',ro:'Toate cauzele 1900–2025. CDR = D/P×10⁵, nu AA 2000. 1900–32 estimări (DRA incomplet). 1933–2024 NVSS. 2025 provizoriu. XA doar dacă e estimat. Notele anuale rămân în engleză.',de:'Alle Ursachen 1900–2025. CDR = D/P×10⁵, nicht AA 2000. 1900–32 Schätzungen (DRA unvollständig). 1933–2024 NVSS. 2025 vorläufig. XA nur wenn geschätzt. Jahresnotizen bleiben Englisch.',es:'Todas las causas 1900–2025. CDR = D/P×10⁵, no AA 2000. 1900–32 estimaciones (DRA incompleta). 1933–2024 NVSS. 2025 provisional. XA solo si está estimado. Las notas anuales quedan en inglés.'},

pT:{en:'Mostly illicit fentanyl. Multiple-cause mention; overlaps the all-drug total. Share = T40.4 ÷ all-drug. 2024–25 paired to the May 2026 NCHS provisional release (2024 all-drug later revised to 79,384).',hu:'Főleg tiltott fentanil. Többszörös említés; átfed a teljes drogsorral. Arány = T40.4 ÷ összes. 2024–25 a 2026. májusi NCHS-előzeteshez igazodik.',ro:'Mai ales fentanil ilicit. Mențiune multiplă; se suprapune. Pondere = T40.4 ÷ toate drogurile. 2024–25 din comunicatul NCHS din mai 2026.',de:'Überwiegend illegales Fentanyl. Mehrfachnennung; überlappt. Anteil = T40.4 ÷ alle Drogen. 2024–25 gemäß NCHS Mai 2026.',es:'Sobre todo fentanilo ilícito. Mención múltiple; se solapa. Cuota = T40.4 ÷ todas las drogas. 2024–25 según NCHS mayo 2026.'},

w0:{en:'No CDC publication states “0 excess deaths in 2025.” Three non-equivalent estimators: (A) vs U.S. expected — 2025 AA 689.2 < 2019 715.2 ⇒ deficit vs a 2019 AA baseline, not a count of zero. (B) vs other high-income countries (Bor et al., JAMA Health Forum 2025) — 705,331 in 2023; 2025 not estimated. (C) raw D 3.09M vs 2.85M is not excess. Do not add U07.1 + XA + XB.',hu:'Nincs CDC-közlés „0 többlethalál 2025-ben.” Három nem egyenértékű becslő. Ne adjuk össze U07.1 + XA + XB.',ro:'Nicio publicație CDC nu spune „0 decese în exces în 2025”. Trei estimatori neechivalenți. Nu adunați U07.1 + XA + XB.',de:'Keine CDC-Publikation sagt „0 Übersterblichkeit 2025“. Drei nicht äquivalente Schätzer. U07.1 + XA + XB nicht addieren.',es:'Ninguna publicación del CDC dice «0 muertes en exceso en 2025». Tres estimadores no equivalentes. No sume U07.1 + XA + XB.'},

mUni:{en:'Universe. U.S. resident deaths occurring in the United States. Territorial and foreign-resident deaths excluded (VSRR 44).',hu:'Sokaság. USA-beli lakosok, az Egyesült Államokban bekövetkezett halálozás. Területi és külföldi lakosok kizárva (VSRR 44).',ro:'Univers. Decese ale rezidenților SUA în Statele Unite. Teritorii și rezidenți străini excluși (VSRR 44).',de:'Grundgesamtheit. Todesfälle von US-Wohnbevölkerung in den USA. Territorien und Auslandsresidenten ausgeschlossen (VSRR 44).',es:'Universo. Defunciones de residentes de EE.UU. ocurridas en Estados Unidos. Territorios y residentes extranjeros excluidos (VSRR 44).'},
mPop:{en:'Population (P). Midyear Census estimates, thousands. CDR = D / P × 10⁵. Not the NCHS year-2000 age-adjusted rate (AA). Vintage 2025 denominators use the 2020 census MARC file and are not strictly comparable to vintage 2024 (VSRR 44).',hu:'Népesség (P). Évközi népszámlálás, ezer. CDR = D / P × 10⁵. Nem a 2000-es NCHS-AA. A 2025-ös nevezők a 2020-as MARC-en alapulnak (VSRR 44).',ro:'Populație (P). Recensământ la mijloc de an, mii. CDR = D / P × 10⁵. Nu AA NCHS 2000. Numitorii 2025 folosesc fișierul MARC 2020 (VSRR 44).',de:'Bevölkerung (P). Jahresmitte, Tausend. CDR = D / P × 10⁵. Nicht NCHS-AA 2000. Nenner 2025: MARC-Akte 2020 (VSRR 44).',es:'Población (P). Censo a mitad de año, miles. CDR = D / P × 10⁵. No AA NCHS 2000. Denominadores 2025: archivo MARC 2020 (VSRR 44).'},
mAc:{en:'All-cause (D). 1900–32 published national estimates (Death Registration Area incomplete). 1933–2024 NVSS registered resident deaths. 2019 final 2,854,838. 2023 final 3,090,964. 2024 final 3,072,666. 2025 provisional 3,094,593 (99.9% of records as of 10 May 2026; VSRR 44). 2026 unpublished. Not UN WPP.',hu:'Minden ok (D). 1900–32 nemzeti becslés (DRA hiányos). 1933–2024 NVSS. 2019 végleges 2 854 838. 2023 3 090 964. 2024 3 072 666. 2025 előzetes 3 094 593 (VSRR 44). 2026 nincs. Nem UN WPP.',ro:'Toate cauzele (D). 1900–32 estimări naționale (DRA incomplet). 1933–2024 NVSS. 2019 final 2.854.838. 2023 3.090.964. 2024 3.072.666. 2025 provizoriu 3.094.593 (VSRR 44). 2026 nepublicat. Nu UN WPP.',de:'Alle Ursachen (D). 1900–32 nationale Schätzungen (DRA unvollständig). 1933–2024 NVSS. 2019 endgültig 2.854.838. 2023 3.090.964. 2024 3.072.666. 2025 vorläufig 3.094.593 (VSRR 44). 2026 unveröffentlicht. Nicht UN WPP.',es:'Todas las causas (D). 1900–32 estimaciones nacionales (DRA incompleta). 1933–2024 NVSS. 2019 final 2.854.838. 2023 3.090.964. 2024 3.072.666. 2025 provisional 3.094.593 (VSRR 44). 2026 inédito. No UN WPP.'},
mAa:{en:'Age-adjusted (AA). Year-2000 U.S. standard million. Separate construct from CDR. 2019 = 715.2; 2023 = 750.5; 2024 = 722.1; 2025 = 689.2 (lowest recorded; provisional). A falling AA with a rising D is consistent with population growth and aging.',hu:'Korszerűsített (AA). 2000-es USA-standard. Külön konstruktum a CDR-től. 2019 = 715,2; 2023 = 750,5; 2024 = 722,1; 2025 = 689,2 (rekordalacsony; előzetes).',ro:'Standardizat pe vârstă (AA). Standard SUA 2000. Construct separat de CDR. 2019 = 715,2; 2023 = 750,5; 2024 = 722,1; 2025 = 689,2 (minim record; provizoriu).',de:'Altersstandardisiert (AA). US-Standard 2000. Anderes Konstrukt als CDR. 2019 = 715,2; 2023 = 750,5; 2024 = 722,1; 2025 = 689,2 (Rekordtief; vorläufig).',es:'Ajustada por edad (AA). Estándar EE.UU. 2000. Constructo distinto de CDR. 2019 = 715,2; 2023 = 750,5; 2024 = 722,1; 2025 = 689,2 (mínimo registrado; provisional).'},
mUcr:{en:'UCR murder. Murder and nonnegligent manslaughter known to police. Not NVSS homicide (ICD). 2021 NIBRS transition reduces intertemporal comparability. 2025 rate 4.1 ties 1955–56.',hu:'UCR-gyilkosság. Rendőrségnek ismert gyilkosság / nem gondatlan emberölés. Nem NVSS-emberölés. 2021 NIBRS rontja az összevethetőséget.',ro:'Omor UCR. Raportat de poliție. Nu omicid NVSS. NIBRS 2021 reduce comparabilitatea.',de:'UCR-Mord. Polizeilich bekannt. Nicht NVSS-Tötung. NIBRS 2021 mindert Vergleichbarkeit.',es:'Asesinato UCR. Conocido por la policía. No homicidio NVSS. NIBRS 2021 reduce comparabilidad.'},
mIcd:{en:'Drug-poisoning. ICD-8 from 1968; ICD-9 1979; ICD-10 1999 — classification breaks. Intent: accidental, suicide, homicide, undetermined. 2024 final 79,384; 2025 provisional 69,973; 12 months ending Feb 2026 = 68,641 (predicted; not calendar 2026). CDR on this page is crude.',hu:'Drogmérgezés. BNO-8 1968; BNO-9 1979; BNO-10 1999 — osztályozási törések. 2024 végleges 79 384; 2025 előzetes 69 973; 12 hónap 2026. febr.-ig = 68 641.',ro:'Intoxicație. CIM-8 din 1968; CIM-9 1979; CIM-10 1999. 2024 final 79.384; 2025 provizoriu 69.973; 12 luni până feb. 2026 = 68.641.',de:'Drogenvergiftung. ICD-8 ab 1968; ICD-9 1979; ICD-10 1999. 2024 endgültig 79.384; 2025 vorläufig 69.973; 12 Monate bis Feb. 2026 = 68.641.',es:'Intoxicación. CIE-8 desde 1968; CIE-9 1979; CIE-10 1999. 2024 final 79.384; 2025 provisional 69.973; 12 meses hasta feb. 2026 = 68.641.'},
mT:{en:'T40.4. Multiple-cause mention, synthetic opioids other than methadone. Mentions overlap; do not add to all-drug.',hu:'T40.4. Többszörös említés, szintetikus opioidok metadon nélkül. Átfed; ne adjuk a teljes drogsorhoz.',ro:'T40.4. Mențiune multiplă, opioide sintetice fără metadonă. Se suprapune; nu adăugați la toate drogurile.',de:'T40.4. Mehrfachnennung, synthetische Opioide außer Methadon. Überlappt; nicht zu allen Drogen addieren.',es:'T40.4. Mención múltiple, opioides sintéticos salvo metadona. Se solapa; no sume al total de drogas.'},
mCov:{en:'COVID-19. ICD-10 U07.1 from 2020. Involving = any mention. Underlying = originating cause. 2024 shown as underlying (31,426). Do not add U07.1 to XA.',hu:'COVID-19. BNO-10 U07.1 2020-tól. Involving = bármely említés. Alapok = kiinduló ok. 2024 alapok 31 426.',ro:'COVID-19. CIM-10 U07.1 din 2020. Involving = orice mențiune. Cauză de bază = originea. 2024 cauză de bază 31.426.',de:'COVID-19. ICD-10 U07.1 ab 2020. Involving = jede Nennung. Grundleiden = Ausgangsursache. 2024 Grundleiden 31.426.',es:'COVID-19. CIE-10 U07.1 desde 2020. Involving = cualquier mención. Causa básica = origen. 2024 causa básica 31.426.'},
mEx:{en:'Excess. XA = residual vs a U.S. expected baseline (OWID / RGA family); method-dependent. XB = U.S. vs other high-income countries (Bor et al. 2025); 2019–2023 only. Missing XA is not zero. 2025 has no CDC “0 excess” year-total.',hu:'Többlet. XA = maradék egy USA-várthoz (OWID/RGA). XB = USA vs más HIC (Bor et al. 2025); csak 2019–2023. A hiányzó XA nem nulla.',ro:'Exces. XA = reziduu față de un așteptat SUA (OWID/RGA). XB = SUA vs alte HIC (Bor et al. 2025); doar 2019–2023. XA lipsă nu e zero.',de:'Übersterblichkeit. XA = Residual vs. US-Erwartung (OWID/RGA). XB = USA vs. andere HIC (Bor et al. 2025); nur 2019–2023. Fehlendes XA ist nicht null.',es:'Exceso. XA = residual frente a un esperado EE.UU. (OWID/RGA). XB = EE.UU. frente a otros HIC (Bor et al. 2025); solo 2019–2023. XA ausente no es cero.'},
mLim:{en:'Limits. Provisional rows revise. Late injury certification undercounts recent injury deaths (VSRR 44). Race/ethnicity on certificates is misclassified for some groups. This file is a transcription, not a primary extract.',hu:'Korlátok. Az előzetes sorok változnak. A késői sérülésigazolás alulszámolja a közeli sérüléses halált. Ez átírás, nem elsődleges kivonat.',ro:'Limite. Rândurile provizorii se revizuiesc. Certificarea întârziată a leziunilor subestimează. Acest fișier e o transcriere, nu un extras primar.',de:'Grenzen. Vorläufige Zeilen werden revidiert. Verspätete Verletzungsbescheinigung untererfasst. Diese Datei ist eine Abschrift, kein Primärextrakt.',es:'Límites. Las filas provisionales se revisan. La certificación tardía de lesiones subcuenta. Este archivo es una transcripción, no un extracto primario.'},
mScope:{en:'Scope. Mortality series only. No private names. No attribution to parties or administrations.',hu:'Hatály. Csak halálozási sorozatok. Nincs magánnév. Nincs párthoz kötés.',ro:'Domeniu. Doar serii de mortalitate. Fără nume private. Fără atribuire politică.',de:'Umfang. Nur Sterbereihen. Keine Privatnamen. Keine Parteizuordnung.',es:'Alcance. Solo series de mortalidad. Sin nombres privados. Sin atribución política.'},

function draw(id,years,series,ymax,unit,marks){
  const c=$(id); if(!c||!years.length) return;
  const cssW=c.getBoundingClientRect().width||(c.parentNode&&c.parentNode.clientWidth)||0;
  const dpr=Math.min(window.devicePixelRatio||1,2.5),W=Math.max(cssW,280),n=years.length,H=210;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';
  const g=c.getContext('2d'); g.scale(dpr,dpr);
  const Lft=44,T=16,R=36,B=36,w=W-Lft-R,h=H-T-B,den=Math.max(1,n-1);
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  g.strokeStyle='#e5e7eb';g.beginPath();g.moveTo(Lft,T);g.lineTo(Lft,T+h);g.lineTo(Lft+w,T+h);g.stroke();
  g.font='10px system-ui';
  for(let i=0;i<=4;i++){
    const yy=T+h*i/4,v=ymax*(1-i/4);
    g.strokeStyle='#f3f4f6';g.beginPath();g.moveTo(Lft,yy);g.lineTo(Lft+w,yy);g.stroke();
    g.fillStyle='#6b7280';g.textAlign='right';g.fillText(v>=100?Math.round(v):v.toFixed(v>=10?0:1),Lft-6,yy+3);
  }
  if(marks){
    marks.forEach(function(my){
      const i=years.indexOf(my); if(i<0) return;
      const x=Lft+w*i/den;
      g.strokeStyle='#c4b5fd';g.setLineDash([3,3]);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+h);g.stroke();g.setLineDash([]);
    });
  }
  const st=n<=14?1:n<=30?2:n<=80?5:10;
  years.forEach((y,i)=>{
    if(i%st&&i&&i!==n-1) return;
    g.save();g.translate(Lft+w*i/den,T+h+13);g.rotate(-.35);
    g.fillStyle='#374151';g.textAlign=i===0?'left':i===n-1?'right':'center';g.fillText(String(y),0,0);g.restore();
  });
  series.forEach(S=>{
    g.strokeStyle=S.c||COL.o;g.lineWidth=S.w||1.8;g.lineJoin='round';g.beginPath();
    let started=0;
    S.s.forEach((v,i)=>{
      if(v==null){started=0;return}
      const x=Lft+w*i/den,yy=T+h*(1-Math.max(0,v)/ymax);
      if(!started){g.moveTo(x,yy);started=1}else g.lineTo(x,yy);
    });
    g.stroke();
    if(n<=20) S.s.forEach((v,i)=>{if(v==null)return;g.fillStyle=S.c||COL.o;g.beginPath();g.arc(Lft+w*i/den,T+h*(1-Math.max(0,v)/ymax),2.1,0,7);g.fill()});
  });
  g.fillStyle='#6b7280';g.textAlign='left';g.fillText(unit||'',Lft,12);
}

    [t('nMurder'),m&&m[1]!=null?m[1].toFixed(1):'—',m&&m[2]!=null?fmt(m[2]):''],
    [t('nOd'),o?fmt(o[1]):'—',ocr(y)!=null?ocr(y).toFixed(1)+' CDR':(y===2026?t('tagW'):'')]
  ])}<div class="note">${note(y)||(y<1933?t('pre'):t('noFlag'))}</div>
    <p><a data-go="five">${t('nYears')}</a> · <a data-go="murder">${t('nMurder')}</a> · <a data-go="od">${t('nOd')}</a> · <a data-go="method">${t('nMet')}</a></p>`;
  toTop();afterPaint();
}
function route(){const h=location.hash.slice(1);h.startsWith('y/')?yr(h.slice(2)):go(h||'home')}
function jump(h){if(location.hash.slice(1)===h)route();else location.hash=h}
function setLang(x){L=x;try{localStorage.setItem('lang',L)}catch(e){}chrome();route()}
chrome();
document.addEventListener('click',e=>{
  const lang=e.target.closest('[data-lang]'); if(lang){e.preventDefault();setLang(lang.dataset.lang);return}
  const a=e.target.closest('[data-go],[data-yr]'); if(!a) return;
  e.preventDefault(); jump(a.dataset.go||('y/'+a.dataset.yr));
});
addEventListener('hashchange',route);
function onView(){clearTimeout(window._rz);window._rz=setTimeout(function(){hdrH();paint()},120)}
addEventListener('resize',onView);
if(window.visualViewport) visualViewport.addEventListener('resize',onView);
document.addEventListener('wheel',e=>{
  if(e.ctrlKey||Math.abs(e.deltaY)<Math.abs(e.deltaX)) return;
  if(window.matchMedia&&matchMedia('(max-width:800px)').matches) return;
  const box=e.target.closest('#side'); if(!box) return;
  const max=box.scrollHeight-box.clientHeight;
  if(max<=1||(box.scrollTop<=0&&e.deltaY<0)||(box.scrollTop>=max-1&&e.deltaY>0)){scrollBy(0,e.deltaY);e.preventDefault()}
},{passive:false,capture:true});
route();
</script>
