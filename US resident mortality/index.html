th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right}

.hi{background:var(--hi)}.pk{background:var(--pk)}.lo{background:var(--lo)}.br{background:var(--br)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin:8px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.card small,.card span{color:var(--mute);font-size:11px;display:block}
.card em{display:block;font:650 1.18rem/1.15 system-ui;font-style:normal;margin:1px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mute);font-size:12px;margin:2px 0 6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px;vertical-align:middle}
.bad{color:#b91c1c;font-weight:600}
footer{border-top:1px solid var(--line);padding:8px 12px calc(16px + env(safe-area-inset-bottom));color:var(--mute);font-size:11px}

function draw(id,years,series,ymax,unit){
  const c=$(id); if(!c||!years.length) return;
  const cssW=c.getBoundingClientRect().width||(c.parentNode&&c.parentNode.clientWidth)||0;
  const dpr=Math.min(window.devicePixelRatio||1,2.5),W=Math.max(cssW,280),n=years.length,H=210;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';
  const g=c.getContext('2d'); g.scale(dpr,dpr);
  const Lft=44,T=16,R=36,B=36,w=W-Lft-R,h=H-T-B,den=Math.max(1,n-1);
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  g.strokeStyle='#e5e7eb';g.beginPath();g.moveTo(Lft,T);g.lineTo(Lft,T+h);g.lineTo(Lft+w,T+h);g.stroke();
  g.font='10px system-ui';
  for(let i=0;i<=4;i++){
    const yy=T+h*i/4,v=ymax*(1-i/4);
    g.strokeStyle='#f3f4f6';g.beginPath();g.moveTo(Lft,yy);g.lineTo(Lft+w,yy);g.stroke();
    g.fillStyle='#6b7280';g.textAlign='right';g.fillText(v>=100?Math.round(v):v.toFixed(v>=10?0:1),Lft-6,yy+3);
  }
  const st=n<=14?1:n<=30?2:n<=80?5:10;
  years.forEach((y,i)=>{
    if(i%st&&i&&i!==n-1) return;
    g.save();g.translate(Lft+w*i/den,T+h+13);g.rotate(-.35);
    g.fillStyle='#374151';g.textAlign=i===0?'left':i===n-1?'right':'center';g.fillText(String(y),0,0);g.restore();
  });
  series.forEach(S=>{
    g.strokeStyle=S.c||COL.o;g.lineWidth=S.w||1.8;g.lineJoin='round';g.beginPath();
    S.s.forEach((v,i)=>{const x=Lft+w*i/den,yy=T+h*(1-Math.max(0,v)/ymax);i?g.lineTo(x,yy):g.moveTo(x,yy)});
    g.stroke();
    if(n<=20) S.s.forEach((v,i)=>{g.fillStyle=S.c||COL.o;g.beginPath();g.arc(Lft+w*i/den,T+h*(1-Math.max(0,v)/ymax),2.1,0,7);g.fill()});
  });

}

  let rows='';
  M.forEach((r,i)=>{
    const p=i?M[i-1][1]:null,d=r[1]==null||p==null?'':((r[1]-p>=0?'+':'')+(r[1]-p).toFixed(1));
    const cls=r[1]==null?'hi':r[1]>=10?'pk':r[1]<=4.2?'lo':(r[0]===2020||r[0]===2021)?'hi':'';
    rows+=`<tr class="${cls}"><td><a data-yr="${r[0]}">${r[0]}</a></td><td>${r[1]==null?'n/a':r[1].toFixed(1)}</td><td>${r[2]==null?'—':fmt(r[2])}</td><td>${d}</td><td class="l">${note(r[0])}</td></tr>`;
  });
  return `<h1>${t('hUcr')}</h1><div class="warn">${t('wUcr')}</div>${table([t('yr'),t('thRate'),t('thCnt'),t('thD'),{t:t('thNote'),l:1}],rows)}`;
},
od(){
  sideYears(1968,2026,1);
  let rows='';
  OD.forEach(r=>{
    const cls=r[0]===1979||r[0]===1999?'br':r[1]>1e5?'pk':r[0]>=2023?'lo':'';
    rows+=`<tr class="${cls}"><td><a data-yr="${r[0]}">${r[0]}</a></td><td>${fmt(r[1])}</td><td>${r[2]==null?'—':r[2]}</td><td>${SYN[r[0]]?fmt(SYN[r[0]]):'—'}</td><td class="l">${note(r[0])}</td></tr>`;
  });
  return `<h1>${t('hPois')}</h1><div class="warn">${t('wPois')}</div>${table([t('yr'),t('thDth'),t('thRate'),'T40.4',{t:t('thNote'),l:1}],rows)}<p>${t('p26')}</p>`;
},
five(){
  sideYears(1900,2026,1);
  let rows='';
  for(let y=1900;y<=2026;y++){
    const m=mOf(y),o=oOf(y),a=ac(y),r=acr(y);
    const cls=y===1918||y===2020||y===2021?'pk':y===1979||y===1999?'br':y===2026?'hi':(m&&m[1]>=10)||(o&&o[1]>1e5)?'pk':y>=2023?'lo':'';
    rows+=`<tr class="${cls}"><td><a data-yr="${y}">${y}</a></td><td>${a?fmt(a):'—'}</td><td>${r?r.toFixed(0):'—'}</td><td>${y<2020?0:fmt(COVID[y])}</td><td>${EXCESS[y]!=null?fmt(EXCESS[y]):(y<1918||(y>1920&&y<2020)?'0':'—')}</td><td>${m&&m[1]!=null?m[1].toFixed(1):'—'}</td><td>${m&&m[2]!=null?fmt(m[2]):'—'}</td><td>${o?fmt(o[1]):'—'}</td><td>${fmt(SYN[y])}</td><td>${VIO[y]??'—'}</td><td class="l">${note(y)||(y<1933?'DRA':'')}</td></tr>`;
  }
  return `<h1>${t('hAnn')}</h1><div class="note">${t('nAnn')}</div>${table([t('yr'),t('allc'),'/100k','COVID','Excess','Mur','n','OD','T40.4','V',{t:t('thNote'),l:1}],rows)}`;
},
compare(){
  sideYears(1970,2025,5);
  const rows=[1970,1980,1990,2000,2010,2015,2020,2022,2025].map(y=>{
    const m=mOf(y),o=oOf(y),ratio=m&&o&&m[2]?(o[1]/m[2]):null;
    return `<tr><td>${y}</td><td>${m?fmt(m[2]):'—'}</td><td>${o?fmt(o[1]):'—'}</td><td>${ratio==null?'—':ratio.toFixed(1)+'×'}</td></tr>`;
  }).join('');
  return `<h1>${t('hCmp')}</h1>${table([t('yr'),'UCR','NVSS','OD/UCR'],rows)}<div class="note">${t('nCmp2')}</div>`;
},
fent(){
  $('side').innerHTML='';
  const rows=[2013,2015,2017,2020,2022,2025].map(y=>{const s=SYN[y],o=oOf(y);return `<tr><td>${y}</td><td>${s?fmt(s):'—'}</td><td>${s&&o?(100*s/o[1]).toFixed(0)+'%':'—'}</td></tr>`}).join('');
  return `<h1>${t('hT')}</h1><p>${t('pT')}</p>${table([t('yr'),'T40.4',t('thSh')],rows)}`;
},
covid(){
  sideYears(1918,2026,1);
  return `<h1>${t('hCov')}</h1><div class="warn">${t('w0')}</div>
    <h2>${t('hCert')}</h2>
    ${table([t('yr'),'Inv.',t('allc'),'%',{t:t('thNote'),l:1}],
      `<tr class="pk"><td>2020</td><td>350,831</td><td>3,383,729</td><td>10.4%</td><td class="l"></td></tr>
       <tr class="pk"><td>2021</td><td>416,893</td><td>3,464,231</td><td>12.0%</td><td class="l"></td></tr>
       <tr><td>2022</td><td>245,614</td><td>3,279,857</td><td>7.5%</td><td class="l"></td></tr>
       <tr><td>2023</td><td>76,446</td><td>3,090,964</td><td>2.5%</td><td class="l"></td></tr>
       <tr><td>2024</td><td>31,426*</td><td>3,072,666</td><td>1.0%</td><td class="l">*underlying</td></tr>
       <tr><td>2025</td><td>—</td><td>3,094,593</td><td>—</td><td class="l">aa 689.2</td></tr>`)}
    <canvas id="ccov"></canvas>
    <h2>${t('hA')}</h2>
    ${table([t('yr'),'Excess',{t:t('thNote'),l:1}],
      `<tr class="pk"><td>2020</td><td>≈480,000</td><td class="l">OWID</td></tr>
       <tr class="pk"><td>2021</td><td>≈460,000</td><td class="l">OWID</td></tr>
       <tr><td>2022</td><td>≈250,000</td><td class="l">OWID</td></tr>
       <tr><td>2023</td><td>≈80,000</td><td class="l">RGA/OWID</td></tr>
       <tr><td>2024</td><td>≈12,300</td><td class="l">RGA 0.4%</td></tr>
       <tr><td>2025</td><td>—</td><td class="l">aa 689.2 &lt; 715.2</td></tr>`)}
    <canvas id="cex"></canvas>
    <h2>${t('hB')}</h2>
    ${table([t('yr'),'HIC'],`<tr><td>2019</td><td>631,247</td></tr><tr class="pk"><td>2020</td><td>1,008,369</td></tr><tr class="pk"><td>2021</td><td>1,098,808</td></tr><tr><td>2022</td><td>820,396</td></tr><tr><td>2023</td><td>705,331</td></tr>`)}
    <canvas id="cpeer"></canvas>
    <h2>${t('h18')}</h2>
    ${table([{t:'',l:1},'1918–19','COVID'],`<tr><td class="l">n</td><td>≈675,000</td><td>≈1.2M</td></tr><tr><td class="l">N</td><td>≈103M</td><td>≈331M</td></tr><tr><td class="l">/100k</td><td>≈650</td><td>≈360</td></tr>`)}`;
},
method(){$('side').innerHTML='';return `<h1>${t('hMet')}</h1><ul><li>${t('mPop')}</li><li>${t('mAc')}</li><li>${t('mUcr')}</li><li>${t('mScope')}</li></ul>`},
src(){$('side').innerHTML='';return `<h1>${t('hSrc')}</h1><p>${t('srcP')}</p><ul><li>FBI UCR 2025 — 4.1 / 14,085</li><li>NCHS WONDER / Data Briefs — poisoning, all-cause</li><li>CDC provisional OD · Feb 2026 = 68,641</li><li>NVSS Deaths: Final Data · 1933–2024</li><li>Census midyear population</li><li>OWID / RGA excess · JAMA Health Forum 2025</li></ul>`}
};
function chrome(){
  document.documentElement.lang=L;
  $('brand').textContent=t('brand');$('sub').textContent=t('sub');$('foot').textContent=t('foot');
  if($('noscript')) $('noscript').textContent=t('ns');
  document.title=t('brand');
  $('langs').innerHTML=LANGS.map(x=>`<button type="button" data-lang="${x[0]}" class="${x[0]===L?'on':''}">${x[1]}</button>`).join('');
  const NAV=[['home',t('nHome')],['charts',t('nCharts')],['murder',t('nMurder')],['od',t('nOd')],['five',t('nYears')],['compare',t('nCmp')],['fent','T40.4'],['covid','COVID'],['method',t('nMet')],['src',t('nSrc')]];
  const qEl=$('q'); const qv=qEl?qEl.value:'';
  $('nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" data-go="${n[0]}">${n[1]}</a>`).join('')+
    `<input id="q" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go" placeholder="${t('yr')}" aria-label="${t('yr')}" maxlength="4" autocomplete="off" value="${qv}">`;
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();jump('y/'+$('q').value.replace(/\D/g,''))}});
}
function hdrH(){const h=$('nav')&&$('nav').parentElement;document.documentElement.style.setProperty('--hdr',(h?Math.ceil(h.getBoundingClientRect().height):52)+'px')}
function toTop(){try{scrollTo(0,0)}catch(e){}if(document.documentElement)document.documentElement.scrollTop=0;if(document.body)document.body.scrollTop=0}
function afterPaint(){hdrH();requestAnimationFrame(function(){requestAnimationFrame(paint)})}
function go(p){if(!PAGES[p])p='home';$('pane').innerHTML=PAGES[p]();toTop();for(const a of $('nav').querySelectorAll('a[data-go]'))a.classList.toggle('on',a.dataset.go===p);afterPaint()}
function yr(y){
  y=+y;if(!y||y<1900||y>2026){location.hash='home';return}
  const m=mOf(y),o=oOf(y),a=ac(y),r=acr(y);
  sideYears(1900,2026,1);
  for(const a of $('nav').querySelectorAll('a[data-go]'))a.classList.remove('on');
  $('pane').innerHTML=`<h1>${y}</h1>${cards([
    [t('allc'),a?fmt(a):'—',a?acTag(y):t('noTot')],
    [t('crude'),r?r.toFixed(0):'—',t('notAa')],
    ['COVID-involving',y<2020?0:fmt(COVID[y]),'U07.1'],
    [t('exU'),EXCESS[y]!=null?fmt(EXCESS[y]):(y<2020?0:'—'),t('notHic')],
    [t('nMurder'),m&&m[1]!=null?m[1].toFixed(1):'—',m&&m[2]!=null?fmt(m[2]):''],
    [t('nOd'),o?fmt(o[1]):'—',o&&o[2]!=null?o[2]:'']
  ])}<div class="note">${note(y)||(y<1933?t('pre'):t('noFlag'))}</div>
    <p><a data-go="five">${t('nYears')}</a> · <a data-go="murder">${t('nMurder')}</a> · <a data-go="od">${t('nOd')}</a></p>`;
  toTop();afterPaint();
}
function route(){const h=location.hash.slice(1);h.startsWith('y/')?yr(h.slice(2)):go(h||'home')}
function jump(h){if(location.hash.slice(1)===h)route();else location.hash=h}
function setLang(x){L=x;try{localStorage.setItem('lang',L)}catch(e){}chrome();route()}
chrome();
document.addEventListener('click',e=>{
  const lang=e.target.closest('[data-lang]'); if(lang){e.preventDefault();setLang(lang.dataset.lang);return}
  const a=e.target.closest('[data-go],[data-yr]'); if(!a) return;
  e.preventDefault(); jump(a.dataset.go||('y/'+a.dataset.yr));
});
addEventListener('hashchange',route);
function onView(){clearTimeout(window._rz);window._rz=setTimeout(function(){hdrH();paint()},120)}
addEventListener('resize',onView);
if(window.visualViewport) visualViewport.addEventListener('resize',onView);
document.addEventListener('wheel',e=>{
  if(e.ctrlKey||Math.abs(e.deltaY)<Math.abs(e.deltaX)) return;
  if(window.matchMedia&&matchMedia('(max-width:800px)').matches) return;
  const box=e.target.closest('#side'); if(!box) return;
  const max=box.scrollHeight-box.clientHeight;
  if(max<=1||(box.scrollTop<=0&&e.deltaY<0)||(box.scrollTop>=max-1&&e.deltaY>0)){scrollBy(0,e.deltaY);e.preventDefault()}
},{passive:false,capture:true});
route();
</script>
</body>
</html>
