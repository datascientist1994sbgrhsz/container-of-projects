<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--b:#0058e6;--face:#ece9d8;--face2:#d4d0c8;--link:#002bb8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
html,body{margin:0;font:13px/1.4 Tahoma,"Segoe UI",sans-serif;color:#111}
body{min-height:100dvh;background:radial-gradient(ellipse 90% 48% at 50% 10%,#b9dcff,#4d94c4 52%,#6b9a28 78%,#3d6a12);overflow:hidden}

.title{flex:0 0 auto;min-height:26px;background:linear-gradient(#0af,#0058e6 42%,#003db8);color:#fff;font-weight:700;display:flex;align-items:center;padding:0 8px;justify-content:space-between;text-shadow:1px 1px #003;gap:8px}
.title b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.x{flex:0 0 auto;width:22px;height:18px;background:#e81123;color:#fff;border:1px solid #fff;font:700 11px Tahoma;text-align:center}
.bar{flex:0 0 auto;background:var(--face2);border-bottom:1px solid #888;padding:4px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}
.bar a{color:var(--link);cursor:pointer;text-decoration:underline;padding:8px 8px;display:inline-block;min-height:36px;line-height:20px;-webkit-tap-highlight-color:transparent}
#main{flex:1;display:flex;min-height:0}
#side{width:min(188px,32vw);flex-shrink:0;background:#fff;border-right:1px solid #999;overflow:auto;padding:6px;-webkit-overflow-scrolling:touch}
#side h4{margin:8px 0 3px;font-size:11px;color:#444}

#pane{flex:1;overflow:auto;padding:10px 12px;background:#fff;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
h1{font:700 1.25rem Tahoma;margin:0 0 6px}
h2{font:700 1rem Tahoma;border-bottom:1px solid #ccc;margin:12px 0 6px}
.note{background:#ffc;border:1px solid #bb8;padding:6px 8px;margin:8px 0}
.warn{background:#fee;border:1px solid #c88}
.okbox{background:#e8ffe8;border:1px solid #8b8}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:12px}
th,td{border:1px solid #bbb;padding:4px 6px;text-align:right}
th{background:#d6e3f0;text-align:center}
td:first-child,th:first-child,td.l,th.l{text-align:left}
.hi{background:#ffe08a}.pk{background:#f7c0c0}.lo{background:#c8f0c8}.br{background:#e0d0ff}
canvas{width:100%;max-width:1100px;background:#fafafa;border:1px solid #aaa;display:block;margin:4px 0 10px;height:auto}
.cards{display:flex;flex-wrap:wrap;gap:7px}
.card{flex:1 1 140px;background:linear-gradient(#fff,#ece9d8);border:1px solid #888;padding:8px}
.card em{display:block;font:700 1.25rem Tahoma;font-style:normal}
.pic{height:70px;border:1px solid #888;margin:6px 0;position:relative;overflow:hidden}
.p-spike{background:linear-gradient(#6eafdc 28%,#222 28% 68%,#5a8a20 68%)}
.p-spike:after{content:"";position:absolute;inset:30% 8% 26%;background:#c00;clip-path:polygon(0 100%,22% 78%,38% 8%,50% 0,62% 14%,80% 72%,100% 100%)}
.p-fent{background:#111} .p-fent:before{content:"lethal ~2 mg fentanyl";position:absolute;right:8px;top:8px;color:#f55;font:700 11px Tahoma}
.p-fent:after{content:"";position:absolute;left:48%;top:42%;width:9px;height:9px;background:#ddd;border-radius:50%;box-shadow:0 0 14px #fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.legend span{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle}
.tb{position:fixed;left:0;right:0;bottom:0;height:calc(28px + env(safe-area-inset-bottom));padding:0 8px env(safe-area-inset-bottom);background:linear-gradient(#3c9bf0,#125dce);color:#fff;font-weight:700;display:flex;align-items:center;font-size:11px}
.bad{color:#a00}.ok{color:#060}
#q{width:4.5rem;min-height:36px;font:14px Tahoma;padding:4px}
@media (max-width:800px){
  #main{flex-direction:column}
  #side{width:100%;max-height:22vh;border-right:0;border-bottom:1px solid #999;display:flex;flex-wrap:wrap;gap:2px}

@media (min-width:1920px){body{font-size:18px}.bar a{padding:12px 14px;font-size:1.05rem}#q{font-size:18px;min-height:44px}.card em{font-size:1.5rem}}
@media (pointer:coarse){.bar a,#side button{min-height:44px}}
@media (prefers-reduced-motion:reduce){* {scroll-behavior:auto}}
</style>

const COVID={2020:350831,2021:416893,2022:245614,2023:76446,2024:null,2025:null,2026:null};

   1918–20 = influenza pandemic (CDC ~675k over the pandemic; split is approximate). */
const EXCESS={1918:500000,1919:175000,1920:25000,2020:480000,2021:460000,2022:250000,2023:80000};
/* All-cause registered deaths (NCHS). Early 1900s = death-registration states only, incomplete. */
const AC={1900:343217,1910:696856,1918:1447139,1920:1142379,1930:1327200,1940:1417269,1950:1452400,1960:1711909,1970:1921031,1980:1989841,1990:2148463,1995:2312132,1999:2391399,2000:2403351,2005:2448017,2010:2468435,2015:2712630,2018:2839205,2019:2854838,2020:3383729,2021:3464231,2022:3279857,2023:3090582,2024:3072666};
const POTUS=[[1897,'McKinley (R)'],[1901,'T. Roosevelt (R)'],[1909,'Taft (R)'],[1913,'Wilson (D)'],[1921,'Harding (R)'],[1923,'Coolidge (R)'],[1929,'Hoover (R)'],[1933,'F. Roosevelt (D)'],[1945,'Truman (D)'],[1953,'Eisenhower (R)'],[1961,'Kennedy (D)'],[1963,'Johnson (D)'],[1969,'Nixon (R)'],[1974,'Ford (R)'],[1977,'Carter (D)'],[1981,'Reagan (R)'],[1989,'G.H.W. Bush (R)'],[1993,'Clinton (D)'],[2001,'G.W. Bush (R)'],[2009,'Obama (D)'],[2017,'Trump (R)'],[2021,'Biden (D)'],[2025,'Trump (R)']];
function potus(y){let p=POTUS[0][1];for(const x of POTUS)if(y>=x[0])p=x[1];return p}
function mOf(y){return M.find(r=>r[0]===y)}
function oOf(y){return OD.find(r=>r[0]===y)}
function note(y){
  const n={
    1918:'Influenza pandemic. CDC ~675k U.S. flu deaths 1918–19. Crude death rate worst since early registration.',
    1919:'Flu pandemic continues (third wave).',
    1920:'Flu residual; mortality falling.',
    1968:'CDC OD series begins (ICD-8 era). Hong Kong flu (mild vs 1918/COVID).',
    1979:'ICD-9 — OD totals not comparable to 1978.',
    1980:'FBI modern murder peak 10.2.',
    1991:'Second murder peak 9.8 (crime-drop starts after).',
    1996:'OxyContin approved — Rx opioid wave.',
    1999:'ICD-10 — OD series steps up. Wave 1 (Rx opioids) visible.',
    2010:'Wave 2 (heroin) accelerating.',
    2013:'Illicit fentanyl takes off (Wave 3).',
    2014:'FBI murder modern low 4.4 before 2015 uptick.',
    2020:'COVID year 1. NCHS 350,831 involving; ~480k excess (OWID US baseline). All-cause 3,383,729. Murder spike — lockdowns ≠ murder drop.',
    2021:'Murder peak of the spike (~6.8). OD >100k.',
    2022:'OD all-time peak. Murder already falling.',
    2023:'OD starts down. Murder 3rd year down from peak.',
    2024:'Largest % OD drop in the modern series (−26% rate). CDC homicide deaths 20,162 ≠ FBI murder count.',
    2025:'FBI murder 4.1 / 14,085 — ties 1955–56 low. OD ~70k. Trump Y1; decline already running.',
    2026:'Provisional OD 68,641 in 12mo ending Feb. SW border historically low. 2 citizen ICE/CBP GSW (unadjudicated).'
  };return n[y]||'';
}
function sideYears(from,to,step,fn){
  let h='<h4>Year</h4>';
  for(let y=from;y<=to;y+=step)h+=`<button onclick="${fn}(${y})">${y}</button>`;
  document.getElementById('side').innerHTML=h;
}
function draw(id,years,seriesList,ymax,unit){
  const c=document.getElementById(id);if(!c||!years||!years.length)return;
  const dpr=window.devicePixelRatio||1,W=Math.max(c.clientWidth||720,640),n=years.length;
  const H=n<=14?280:n<=25?300:320;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';
  const g=c.getContext('2d');g.scale(dpr,dpr);
  const L=44,T=18,R=18,B=36,w=W-L-R,h=H-T-B;
  g.fillStyle='#fafafa';g.fillRect(0,0,W,H);
  g.strokeStyle='#ccc';g.beginPath();g.moveTo(L,T);g.lineTo(L,T+h);g.lineTo(L+w,T+h);g.stroke();
  g.fillStyle='#555';g.font='10px Tahoma';
  for(let i=0;i<=4;i++){
    const yy=T+h*i/4,v=ymax*(1-i/4);
    g.strokeStyle='#eee';g.beginPath();g.moveTo(L,yy);g.lineTo(L+w,yy);g.stroke();
    g.fillStyle='#555';g.fillText(v>=100?Math.round(v):v.toFixed(v>=10?0:1),2,yy+3);
  }
  const step=n<=14?1:n<=30?2:5;
  years.forEach((y,i)=>{
    if(i%step&&i!==n-1&&i)return;
    const xx=L+w*i/Math.max(1,n-1);
    g.fillStyle='#333';g.save();g.translate(xx,T+h+11);g.rotate(-0.55);g.fillText(String(y),0,0);g.restore();
  });
  seriesList.forEach(S=>{
    const s=S.s,col=S.c||'#06c';
    g.strokeStyle=col;g.lineWidth=S.w||2;g.beginPath();
    s.forEach((v,i)=>{const xx=L+w*i/Math.max(1,n-1),yy=T+h*(1-Math.max(0,v)/ymax);i?g.lineTo(xx,yy):g.moveTo(xx,yy)});
    g.stroke();
    s.forEach((v,i)=>{
      const show=n<=14||i%step===0||i===n-1||i===0;
      if(!show)return;
      const xx=L+w*i/Math.max(1,n-1),yy=T+h*(1-Math.max(0,v)/ymax);
      g.fillStyle=col;g.beginPath();g.arc(xx,yy,3,0,7);g.fill();
      const lab=S.fmt?S.fmt(v):String(Math.round(v));
      g.font='bold 9px Tahoma';g.fillStyle='#111';
      g.fillText(lab,Math.min(xx+4,W-40),Math.max(yy-6,12));
    });
  });
  g.font='10px Tahoma';g.fillStyle='#333';g.fillText(unit||'',L,12);
}
function covY(y){return y<2020?0:(COVID[y]||0)}
function paintAllCharts(){
  const mOk=M.filter(r=>r[1]!=null);
  draw('cm',mOk.map(r=>r[0]),[{s:mOk.map(r=>r[1]),c:'#c00',fmt:v=>v.toFixed(1)}],12,'Murder rate per 100,000');
  draw('co',OD.map(r=>r[0]),[{s:OD.map(r=>r[1]/1000),c:'#06c',fmt:v=>v>=10?Math.round(v)+'k':v.toFixed(1)+'k'}],120,'Overdose deaths (thousands)');
  const y15=[...Array(11)].map((_,i)=>2015+i);
  const k=v=>Math.round(v)+'k';
  draw('c3',y15,[
    {s:y15.map(y=>(mOf(y)?mOf(y)[2]:0)/1000),c:'#c00',fmt:k},
    {s:y15.map(y=>(oOf(y)?oOf(y)[1]:0)/1000),c:'#06c',fmt:k},
    {s:y15.map(y=>y<2020?0:(COVID[y]?COVID[y]/1000:0)),c:'#609',fmt:k}
  ],450,'Thousands · red murder · blue OD · purple COVID (official thru 2023)');
  draw('c4',y15.filter(y=>AC[y]),[{s:y15.filter(y=>AC[y]).map(y=>AC[y]/1000),c:'#333',fmt:k}],3600,'All-cause deaths (thousands)');
  const yC=[2018,2019,2020,2021,2022,2023];
  draw('ccov',yC,[{s:yC.map(y=>(y<2020?0:COVID[y])/1000),c:'#609',fmt:k}],450,'COVID-involving deaths (thousands) · NCHS thru 2023');
  const yEx=[2015,2016,2017,2018,2019,2020,2021,2022,2023];
  draw('cex15',yEx,[{s:yEx.map(y=>(EXCESS[y]||0)/1000),c:'#c60',w:2.5,fmt:v=>v?Math.round(v)+'k':'0'}],600,'Excess vs U.S. expected (thousands)');
  const y18=[1917,1918,1919,1920,1921];
  draw('cex18',y18,[{s:y18.map(y=>(EXCESS[y]||0)/1000),c:'#850',w:2.5,fmt:v=>v?Math.round(v)+'k':'0'}],550,'1918 flu excess (thousands)');
  draw('cex',yEx,[{s:yEx.map(y=>(EXCESS[y]||0)/1000),c:'#c60',fmt:v=>v?Math.round(v)+'k':'0'}],600,'Excess (thousands)');
  draw('cflu',['1918–19 flu','COVID 2020–23'],[{s:[675,1089],c:'#850',w:6,fmt:v=>v+'k'}],1300,'Pandemic deaths (thousands)');
}

    requestAnimationFrame(paintAllCharts);

  else if(p==='murder'){
    sideYears(1960,2026,1,'yr');
    let t=`<h1>Murder / non-negligent manslaughter — FBI UCR every year</h1>
    <div class="note warn">Police-reported <b>murder</b>. CDC <b>homicide</b> (death certificates) is a few thousand higher some years. 2024 CDC homicide = 20,162 — not the FBI murder count.</div>

function wrapTables(){
  document.querySelectorAll('#pane > table').forEach(t=>{
    const d=document.createElement('div');d.className='scroll';t.parentNode.insertBefore(d,t);d.appendChild(t);
  });
}
function yr(y){
  if(!y||y<1900||y>2026){go('home');return}
  const m=mOf(y),o=oOf(y),mp=mOf(y-1),op=oOf(y-1);
  sideYears(1900,2026,1,'yr');
  document.getElementById('pane').innerHTML=`<h1>${y}</h1>
    <p><b>${potus(y)}</b></p>
    <div class="cards">
      <div class="card"><small>All-cause deaths</small><em>${AC[y]?AC[y].toLocaleString():'—'}</em>NCHS (early years incomplete)</div>
      <div class="card"><small>COVID-involving</small><em>${y<2020?0:(COVID[y]==null?'—':COVID[y].toLocaleString())}</em>certificate U07.1</div>
      <div class="card"><small>Excess vs U.S. expected</small><em>${EXCESS[y]!=null?EXCESS[y].toLocaleString():(y<2020?0:'—')}</em>not vs Europe</div>
      <div class="card"><small>FBI murder rate</small><em>${m&&m[1]!=null?m[1].toFixed(1):'—'}</em>${m&&m[2]!=null?m[2].toLocaleString():''}</div>
      <div class="card"><small>CDC overdose</small><em>${o?o[1].toLocaleString()+(y===2026?'*':''):'—'}</em>${o&&o[2]!=null?'rate '+o[2]:''}</div>
      <div class="card"><small>Synthetics / violent</small><em>${SYN[y]?SYN[y].toLocaleString():'—'}</em>viol. ${VIO[y]??'—'}</div>
    </div>
    <div class="note">${note(y)||'No special flag. Use Murder y/y and Overdose y/y for neighbors.'}</div>
    <p><a onclick="go('murder')">All murder years</a> · <a onclick="go('od')">All OD years</a></p>`;
}
